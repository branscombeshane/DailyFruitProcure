// ---------- Purchase Costs ----------
function renderPurchase(){
  const bpSet = distinctBaseProducts();
  // Buying the same base product from two suppliers on the same day is normal now (not a duplicate to
  // flag) — so this list no longer marks repeats within a date, it just shows every line as-is,
  // including which supplier it came from.
  const entries = DATA.purchaseCosts.map((p,i)=>{
    const found = bpSet.includes(p.baseProduct);
    const count = DATA.itemSetup.filter(it=>it.baseProduct===p.baseProduct).length;
    return {p, i, found, count, dateKey: p.date || "(no date)"};
  });

  // The default filter (today's date — see purchaseDateFilter's declaration) won't be in this list on a
  // day nothing's been logged yet; folded in here so the dropdown still shows/selects it correctly and
  // the empty state below reads as "nothing today" rather than silently falling back to "All dates".
  const distinctDates = Array.from(new Set(entries.map(e=>e.dateKey).concat(purchaseDateFilter ? [purchaseDateFilter] : []))).sort().reverse();
  const dateFilterOptions = `<option value="">All dates</option>` +
    distinctDates.map(d=>`<option value="${esc(d)}" ${d===purchaseDateFilter?"selected":""}>${esc(d)}</option>`).join("");

  const groupDates = purchaseDateFilter ? distinctDates.filter(d=>d===purchaseDateFilter) : distinctDates;
  const groupsHtml = groupDates.map(dateKey=>{
    const group = entries.filter(e=>e.dateKey===dateKey);
    if(!group.length) return ""; // today (or whichever date is filtered) with nothing logged yet — see the empty-state message below instead
    const groupRows = group.map(({p,i,found,count})=>{
      // Once Receiving has confirmed a line, ITS numbers are the real, final ones (Receiving's own copy
      // says as much) — a correction made there only ever touches receivedQty/receivedCost, never the
      // original ordered qty/cost (see data-receive-tick in wire_events.js), so this used to keep
      // showing the stale ordered figure forever even after a correction. Falls back to the ordered
      // figure while still pending, or if a received line's cost genuinely wasn't captured at receiving
      // time (receivedCost left blank on purpose).
      const received = isReceived(p);
      const notReceived = isNotReceived(p);
      const hasReceivedQty = received && p.receivedQty!==undefined && p.receivedQty!==null && p.receivedQty!=="";
      const hasReceivedCost = received && p.receivedCost!==undefined && p.receivedCost!==null && p.receivedCost!=="";
      const displayQty = hasReceivedQty ? p.receivedQty : p.qty;
      const displayCost = hasReceivedCost ? p.receivedCost : p.cost;
      const hasQty = displayQty!==undefined && displayQty!==null && displayQty!=="";
      const hasCost = displayCost!==undefined && displayCost!==null && displayCost!=="";
      const total = (hasQty && hasCost) ? Number(displayQty)*Number(displayCost) : null;
      // A status chip used to sit right after the product name on the same line — fine when it fit, but
      // on a narrow name+chip combo (e.g. "Not received: NOT BOOKED") it would wrap onto its own line
      // UNDER the name anyway, just unpredictably (sometimes crowding the name half off to one side
      // first). Shane's "fix the layout" ask: always stack it on its own line below the name, so the
      // product name is never in doubt and every row keeps the same shape whether it has a tag or not.
      const statusTag = notReceived ? chip("Not received" + (p.notReceivedReason?": "+p.notReceivedReason:""), "critical") : (!received ? chip("Ordered","neutral") : "");
      return `
      <tr>
        <td>${esc(p.baseProduct)}${statusTag ? `<div style="margin-top:4px;">${statusTag}</div>` : ""}</td>
        <td class="num">${hasQty ? fmtNum(displayQty) : "—"}</td>
        <td class="num">${hasCost ? money(displayCost) : "—"}</td>
        <td class="num">${total!==null ? money(total) : "—"}</td>
        <td>${esc(p.supplier||"—")}</td>
        <td>${found?statusChip("OK"):statusChip("NOT FOUND")}</td>
        <td class="num">${count}</td>
        <td class="helptext">${esc(p.loggedBy||"—")}</td>
        <td class="helptext">${esc(notReceived ? (p.notReceivedBy||"—") : (p.receivedBy||"—"))}${(!notReceived && p.receivedTime) ? " " + esc(fmtTime(p.receivedTime)) : ""}</td>
        <td><button class="delbtn" data-del-purchase="${i}" title="Remove row">✕</button></td>
      </tr>`;
    }).join("");
    return `
      <div class="tablewrap" style="border:none;border-radius:0;border-bottom:1px solid var(--line);">
        <table>
          <thead>
            <tr><th colspan="10" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);">${esc(dateKey)} — ${group.length} ${group.length===1?"entry":"entries"}</th></tr>
            <tr><th>Base product</th><th class="num">Qty</th><th class="num">Cost / unit</th><th class="num">Total</th><th>Supplier</th><th>Found?</th><th class="num">Item codes affected</th><th>Logged by</th><th>Received by</th><th></th></tr>
          </thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Purchase Costs</h2><p>Every purchase logged through Receiving, Quick Buy, or the Shopping List lands here automatically — this page is for reviewing those figures and removing a line only if it was logged by mistake.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Current entries</h3><div class="desc">Multiple lines for the same product on the same day (different suppliers) are expected — remove a line only if it was a mistake. Qty/Cost/Total show the confirmed Receiving figures once a line's been received (including any correction made there) — the "Ordered" tag marks a line still awaiting confirmation, still showing what it was ordered at.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Filter by date</label>
          <select id="purchDateFilter">${dateFilterOptions}</select>
        </div>
      </div>
      <div class="cardbody" style="padding:0;">
        ${groupsHtml || `<div class="empty">${purchaseDateFilter ? `No purchases logged for ${esc(purchaseDateFilter)}.` : "No purchases logged yet."}</div>`}
      </div>
    </div>`;
}

// ---------- Price History ----------
// A neutral-ink line (not the app's --accent, since --accent and --good happen to be the same green —
// using --accent for the ordinary line would make a "big drop" alert dot blend right into it) with
// alert points picked out in --critical (price went up) / --good (price went down), each carrying an
// arrow + % label so the signal is never color-alone. SVG <title> elements give every point a native
// hover tooltip; the full table underneath the chart carries the same numbers with nothing hidden
// behind hover, per the same "reachable without hovering" rule the rest of the app already follows.
function renderPriceChart(baseProduct, points){
  if(points.length < 2){
    return `<div class="empty" style="padding:32px 16px;">Only one received purchase on file for this product so far — need at least two to chart a trend.</div>`;
  }
  const W = 920, H = 260, padL = 54, padR = 20, padT = 18, padB = 36;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const costs = points.map(p=>p.cost);
  let lo = Math.min(...costs), hi = Math.max(...costs);
  if(lo===hi){ lo = lo*0.9; hi = (hi*1.1)||1; }
  const span = hi-lo, pad = span*0.12;
  lo -= pad; hi += pad;
  const xAt = i => padL + (points.length===1 ? plotW/2 : (i/(points.length-1))*plotW);
  const yAt = v => padT + plotH - ((v-lo)/(hi-lo))*plotH;

  const linePath = points.map((p,i)=> (i===0?"M":"L") + xAt(i).toFixed(1) + "," + yAt(p.cost).toFixed(1)).join(" ");
  const areaPath = linePath + ` L${xAt(points.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xAt(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const yTickCount = 4;
  const gridlines = Array.from({length:yTickCount+1}, (_,i)=>{
    const v = lo + (hi-lo)*(i/yTickCount);
    const yy = yAt(v);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${(padL-8).toFixed(1)}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${esc(money(round2(v)))}</text>`;
  }).join("");

  const labelEvery = Math.max(1, Math.ceil(points.length/9));
  const xLabels = points.map((p,i)=>{
    if(i%labelEvery!==0 && i!==points.length-1) return "";
    // First/last labels anchor to start/end instead of centering, so a full "YYYY-MM-DD" string at the
    // very edge of the plot never overflows past the SVG's own viewBox and gets clipped.
    const anchor = i===0 ? "start" : (i===points.length-1 ? "end" : "middle");
    return `<text x="${xAt(i).toFixed(1)}" y="${H-12}" text-anchor="${anchor}" font-size="10" fill="var(--muted)">${esc(p.date)}</text>`;
  }).join("");

  const dots = points.map((p,i)=>{
    const color = p.alert==="up" ? "var(--critical)" : p.alert==="down" ? "var(--good)" : "var(--ink)";
    const r = p.alert ? 5 : 4;
    const changeTxt = p.changePct!==null ? ` (${p.changePct>=0?"+":""}${Math.round(p.changePct*100)}%)` : "";
    const tip = `${p.date}: ${money(p.cost)}${changeTxt}`;
    const arrowLabel = p.alert ? `<text x="${xAt(i).toFixed(1)}" y="${(yAt(p.cost) + (p.alert==="up" ? -12 : 20)).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${p.alert==="up"?"▲":"▼"} ${Math.abs(Math.round(p.changePct*100))}%</text>` : "";
    return `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(p.cost).toFixed(1)}" r="${r}" fill="${color}" stroke="var(--surface)" stroke-width="2"><title>${esc(tip)}</title></circle>${arrowLabel}`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;" role="img" aria-label="Price history for ${esc(baseProduct)}">
    ${gridlines}
    <path d="${areaPath}" fill="var(--accent)" opacity="0.08" stroke="none"/>
    <path d="${linePath}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

// Clickable summary tile for the three alert-type stats atop Price History — clicking one filters the
// Recent alerts table below to just that slice (clicking the already-active one clears back to all),
// same toggle convention as Shopping List's status tiles (statBlock) above.
function priceStatBlock(label, filterValue, count, color, small){
  const active = priceHistoryAlertFilter === filterValue;
  return `<div class="stat clickable${active?" active":""}" data-price-alert-filter="${esc(filterValue)}" title="Show only ${esc(label)}${active?" (click again to clear)":""}">
    <div class="label">${esc(label)}</div><div class="value${small?" small":""}" style="color:${color}">${count}</div>
  </div>`;
}

function renderPriceHistory(){
  const alertPct = Number(DATA.shoppingList.priceAlertPct)||0.25;
  const alerts30 = recentPriceAlerts(30);
  const productNames = Array.from(new Set(DATA.purchaseCosts.filter(p=>p.baseProduct && isReceived(p)).map(p=>p.baseProduct))).sort();

  // Default to the biggest current alert if there is one — that's almost always what someone opening
  // this page actually wants to see first — otherwise the first product alphabetically, otherwise none.
  if(!priceHistorySelectedProduct || !productNames.includes(priceHistorySelectedProduct)){
    priceHistorySelectedProduct = (alerts30[0] && alerts30[0].baseProduct) || productNames[0] || null;
  }

  const productOptions = productNames.map(bp=>`<option value="${esc(bp)}" ${bp===priceHistorySelectedProduct?"selected":""}>${esc(bp)}</option>`).join("");

  const alerts30Shown = priceHistoryAlertFilter ? alerts30.filter(a=> a.direction===priceHistoryAlertFilter) : alerts30;
  const alertRows = alerts30Shown.map(a=>`
    <tr>
      <td>${esc(a.baseProduct)}</td>
      <td class="helptext">${esc(a.date)}</td>
      <td class="num">${money(a.prevCost)} → ${money(a.cost)}</td>
      <td>${chip((a.direction==="up"?"▲ +":"▼ ")+Math.round(a.changePct*100)+"%", a.direction==="up"?"critical":"good")}</td>
      <td><button class="btn small" data-select-product="${esc(a.baseProduct)}">View chart</button></td>
    </tr>`).join("");

  const points = priceHistorySelectedProduct ? priceHistoryForProduct(priceHistorySelectedProduct) : [];
  const tableRows = points.slice().reverse().map(p=>`
    <tr>
      <td class="helptext">${esc(p.date)}</td>
      <td class="num">${money(p.cost)}</td>
      <td class="num">${p.changePct!==null ? (p.changePct>=0?"+":"")+Math.round(p.changePct*100)+"%" : "—"}</td>
      <td>${p.alert ? chip((p.alert==="up"?"▲ big increase":"▼ big drop"), p.alert==="up"?"critical":"good") : ""}</td>

  return `
    <div class="pagehead">
      <div><h2>Price History</h2><p>Tracks the received cost of every product purchase over time and flags any move of ${Math.round(alertPct*100)}% or more from one purchase to the next, up or down — so a price spike (or a supplier finally coming down) never goes unnoticed.</p></div>
    </div>
    <div class="cardrow">
      <div class="stat"><div class="label">Products tracked</div><div class="value">${productNames.length}</div></div>
      ${priceStatBlock("Alerts (30d)", "", alerts30.length, alerts30.length?'var(--warn)':'var(--good)')}
      ${priceStatBlock("Big increases (30d)", "up", alerts30.filter(a=>a.direction==='up').length, alerts30.some(a=>a.direction==='up')?'var(--critical)':'var(--good)')}
      ${priceStatBlock("Big drops (30d)", "down", alerts30.filter(a=>a.direction==='down').length, 'var(--good)')}
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Alert threshold</h3><div class="desc">How big a move (either direction) has to be, purchase to purchase, to count as an alert.</div></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Alert threshold %</label><input type="number" step="1" min="1" id="priceAlertPctInput" value="${round2(alertPct*100)}"></div>
          <div><button class="btn primary" id="savePriceAlertPct">Save</button></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Recent alerts</h3><div class="desc">${alerts30Shown.length}${priceHistoryAlertFilter?` of ${alerts30.length}`:""} product${alerts30Shown.length===1?"":"s"} with a big ${priceHistoryAlertFilter==="up"?"increase":priceHistoryAlertFilter==="down"?"drop":"move"} in the last 30 days, biggest first.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Date</th><th>Was → Now</th><th>Move</th><th></th></tr></thead>
          <tbody>${alertRows || `<tr><td colspan="5" class="empty">${priceHistoryAlertFilter ? `No big ${priceHistoryAlertFilter==="up"?"increases":"drops"} in the last 30 days.` : "No big moves in the last 30 days."}</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>${priceHistorySelectedProduct ? esc(priceHistorySelectedProduct) : "Price chart"}</h3><div class="desc">Received cost per purchase, oldest to newest.</div></div>
        <div class="field" style="min-width:220px;"><label>Product</label><select id="priceHistoryProductSel">${productOptions || `<option value="">No products with received purchases yet</option>`}</select></div>
      </div>
      <div class="cardbody">
        ${priceHistorySelectedProduct ? renderPriceChart(priceHistorySelectedProduct, points) : `<div class="empty">Nothing to chart yet — once a purchase is logged and received, its price history will show up here.</div>`}
      </div>
      ${points.length ? `<div class="cardbody" style="padding-top:0;">
        <div class="tablewrap" style="border:1px solid var(--line); border-radius:8px; max-height:320px; overflow-y:auto;"><table>
          <thead><tr><th>Date</th><th class="num">Cost</th><th class="num">Change</th><th>Flag</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table></div>
      </div>` : ""}
    </div>`;
}

// ---------- Stock Take ----------
function renderStockTake(){
  const byCat = {};
  distinctBaseProducts().forEach(bp=>{
    const cat = categoryFor(bp) || "Uncategorized";
    (byCat[cat] = byCat[cat]||[]).push(bp);
  });
  const categories = Object.keys(byCat).sort();
  const catForBp = {};
  categories.forEach(c=> byCat[c].forEach(bp=> catForBp[bp]=c));

  const hasValue = v => v!==undefined && v!==null && v!=="";

  // records already saved for the currently selected stock-take date, keyed by base product
  const takesForDate = {};
  DATA.stockTakes.forEach(r=>{
    if(r.date === stockTakeDate) takesForDate[r.baseProduct] = r.amount;
  });

  const catOptions = categories.map(c=>{
    const bps = byCat[c];
    const entered = bps.filter(bp=>hasValue(takesForDate[bp])).length;
    return `<option value="${esc(c)}" ${c===stockCategoryFilter?"selected":""}>${esc(c)} (${entered}/${bps.length})</option>`;
  }).join("");

  let entryCardHtml = "";
  if(stockCategoryFilter && byCat[stockCategoryFilter]){
    const bps = byCat[stockCategoryFilter].slice().sort();
    const rows = bps.map(bp=>{
      const val = takesForDate[bp];
      return `<tr>
        <td>${esc(bp)}</td>
        <td><input class="rowinput num" data-stock-bp="${esc(bp)}" value="${hasValue(val)?val:""}" placeholder="0" style="max-width:140px;"></td>
      </tr>`;
    }).join("");
    entryCardHtml = `
    <div class="card">
      <div class="cardhead">
        <div><h3>${esc(stockCategoryFilter)} — ${esc(stockTakeDate)}</h3><div class="desc">${bps.length} base product(s) in this category. Enter the stock amount counted on this date, then submit. Already-entered amounts are editable — correct and resubmit if needed.</div></div>
        <button class="btn primary" id="submitStockTake">Submit</button>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;">
          <table>
            <thead><tr><th>Base product</th><th class="num">Stock amount</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>
    </div>`;
  }

  const archiveEntries = DATA.stockTakes.map((r,i)=>({r,i}));
  const distinctArchiveDates = Array.from(new Set(archiveEntries.map(e=>e.r.date))).sort().reverse();
  const archiveDateFilterOptions = `<option value="">All dates</option>` +
    distinctArchiveDates.map(d=>`<option value="${esc(d)}" ${d===stockArchiveDateFilter?"selected":""}>${esc(d)}</option>`).join("");

  const archiveGroupDates = stockArchiveDateFilter ? distinctArchiveDates.filter(d=>d===stockArchiveDateFilter) : distinctArchiveDates;
  const archiveGroupsHtml = archiveGroupDates.map(dateKey=>{
    const group = archiveEntries.filter(e=>e.r.date===dateKey).slice().sort((a,b)=> a.r.baseProduct.localeCompare(b.r.baseProduct));
    const groupRows = group.map(({r,i})=>`
      <tr>
        <td>${esc(r.baseProduct)}</td>
        <td>${esc(catForBp[r.baseProduct]||"Uncategorized")}</td>
        <td class="num">${fmtNum(r.amount,0)}</td>
        <td class="helptext">${esc(r.loggedBy||"—")}</td>
        <td><button class="delbtn" data-del-stocktake="${i}" title="Remove row">✕</button></td>
      </tr>`).join("");
    return `
      <div class="tablewrap" style="border:none;border-radius:0;border-bottom:1px solid var(--line);">
        <table>
          <thead>
            <tr><th colspan="5" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);">${esc(dateKey)} — ${group.length} ${group.length===1?"entry":"entries"}</th></tr>
            <tr><th>Base product</th><th>Category</th><th class="num">Stock amount</th><th>Logged by</th><th></th></tr>
          </thead>
          <tbody>${groupRows}</tbody>
        </table>
      </div>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Input Stock Levels</h2><p>Pick the date, choose a category, enter the stock count for each base product, then submit. Every submission is kept in the archive below so you can look back at any previous day.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Stock take date</h3><div class="desc">Entries are saved against this date. Pick an earlier date to review or correct a past stock take.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Date</label>
          <input type="date" id="stockTakeDateInput" value="${esc(stockTakeDate)}">
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Category</h3><div class="desc">Choose a category to load its base products below.</div></div>
        <div class="field" style="min-width:220px;">
          <label>Category</label>
          <select id="stockCategorySelect">
            <option value="">Select a category…</option>
            ${catOptions}
          </select>
        </div>
      </div>
    </div>
    ${entryCardHtml}
    <div class="card">
      <div class="cardhead">
        <div><h3>Archive</h3><div class="desc">Every stock take submitted, grouped by date.</div></div>
        <div class="field" style="min-width:170px;">
          <label>Filter by date</label>
          <select id="stockArchiveDateFilter">${archiveDateFilterOptions}</select>
        </div>
        <button class="btn" id="downloadStockArchiveCsv" ${archiveGroupDates.length?"":"disabled"}>Export CSV</button>
      </div>
      <div class="cardbody" style="padding:0;">
        ${archiveGroupsHtml || `<div class="empty">No stock takes submitted yet.</div>`}
      </div>
    </div>`;
}

// ---------- Stock Variance (shrinkage) ----------
function stockVarianceStatusChip(label){
  const kind = {"Shrinkage":"critical","Surplus":"warn","Balanced":"good","Incomplete data":"warn","Not enough stock takes":"neutral"}[label] || "neutral";
  return chip(label, kind);
}
function renderStockVariance(){
  const flagPct = (Number(stockVarianceFlagPct)>=0 ? Number(stockVarianceFlagPct) : 0.05);
  const allRows = stockVarianceComputed().map(r=> Object.assign({}, r, {display: stockVarianceClass(r, flagPct)}));

  const counts = {"Shrinkage":0,"Surplus":0,"Balanced":0,"Incomplete data":0,"Not enough stock takes":0};
  allRows.forEach(r=> counts[r.display] = (counts[r.display]||0)+1);

  const statusList = ["Shrinkage","Surplus","Balanced","Incomplete data","Not enough stock takes"];
  const statusOptions = `<option value="">All statuses</option>` +
    statusList.map(s=>`<option value="${esc(s)}" ${s===stockVarianceStatusFilter?"selected":""}>${esc(s)} (${counts[s]||0})</option>`).join("");

  const rows = stockVarianceStatusFilter ? allRows.filter(r=> r.display===stockVarianceStatusFilter) : allRows;

  const tableRows = rows.map(r=>{
    if(r.status==="Not enough stock takes"){
      return `<tr>
        <td>${esc(r.baseProduct)}</td>
        <td colspan="7" class="helptext">Only ${r.takesCount} stock take${r.takesCount===1?"":"s"} on file — needs at least 2 (an opening and a closing count) before a variance can be worked out.</td>
        <td>${stockVarianceStatusChip(r.display)}</td>
      </tr>`;
    }
    const windowLabel = `${esc(r.openingDate)} → ${esc(r.closingDate)}`;
    if(r.status==="Incomplete data"){
      const shownMissing = r.missingDates.slice(0,4).map(esc).join(", ");
      const moreCount = r.missingDates.length - 4;
      return `<tr>
        <td>${esc(r.baseProduct)}</td>
        <td class="helptext">${windowLabel}</td>
        <td class="num">${fmtNum(r.opening)}</td>
        <td class="num">${fmtNum(r.purchasesInWindow)}</td>
        <td colspan="4" class="helptext">No Item Sales report (or no usable conversion factor that day) for: ${shownMissing}${moreCount>0?` and ${moreCount} more`:""} — can't tell what actually sold, so this window can't be checked.</td>
        <td>${stockVarianceStatusChip(r.display)}</td>
      </tr>`;
    }
    // colored to match the Status column's classification (which already accounts for the flag
    // threshold) rather than raw sign — a tiny, within-tolerance variance shouldn't read as alarming red
    const varianceKind = r.display==="Shrinkage" ? "critical" : r.display==="Surplus" ? "warn" : "good";
    const varianceChip = chip((r.variance>0?"+":"")+fmtNum(r.variance)+(r.variancePct!==null?` (${r.variance>0?"+":""}${Math.round(r.variancePct*100)}%)`:""), varianceKind);
    return `<tr>
      <td>${esc(r.baseProduct)}</td>
      <td class="helptext">${windowLabel}</td>
      <td class="num">${fmtNum(r.opening)}</td>
      <td class="num">${fmtNum(r.purchasesInWindow)}</td>
      <td class="num">${fmtNum(r.salesUsage)}</td>
      <td class="num">${fmtNum(r.expectedClosing)}</td>
      <td class="num">${fmtNum(r.closing)}</td>
      <td>${varianceChip}</td>
      <td>${stockVarianceStatusChip(r.display)}</td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Stock Variance</h2><p>For each product, compares the two most recent Stock Take counts against what Receiving says came in and what the Item Sales reports say went out in between, to see whether the numbers actually add up. Owner-only — nothing new to enter, it's built entirely from Stock Take, Receiving and Item Sales data already on file. A window with a gap in daily sales report coverage is marked "Incomplete data" rather than guessing.</p></div>
    </div>
    <div class="cardrow">
      <div class="stat"><div class="label">Shrinkage</div><div class="value" style="color:${counts["Shrinkage"]?'var(--critical)':'var(--good)'}">${counts["Shrinkage"]}</div></div>
      <div class="stat"><div class="label">Surplus</div><div class="value" style="color:${counts["Surplus"]?'var(--warn)':'var(--good)'}">${counts["Surplus"]}</div></div>
      <div class="stat"><div class="label">Balanced</div><div class="value" style="color:var(--good)">${counts["Balanced"]}</div></div>
      <div class="stat"><div class="label">Incomplete data</div><div class="value small">${counts["Incomplete data"]}</div></div>
      <div class="stat"><div class="label">Not enough stock takes</div><div class="value small">${counts["Not enough stock takes"]}</div></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Flag threshold</h3><div class="desc">How big the gap between expected and actual closing stock has to be, as a % of expected, to count as real shrinkage or surplus rather than normal counting noise. Not saved — resets to 5% next time this tab is opened.</div></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Flag threshold %</label><input type="number" step="1" min="0" id="stockVarianceFlagPctInput" value="${round2(flagPct*100)}"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Products</h3><div class="desc">${rows.length}${stockVarianceStatusFilter?` of ${allRows.length}`:""} product(s), worst shrinkage first.</div></div>
        <div class="field" style="min-width:200px;"><label>Status</label><select id="stockVarianceStatusFilterSel">${statusOptions}</select></div>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Window</th><th class="num">Opening</th><th class="num">Purchases</th><th class="num">Sales usage</th><th class="num">Expected</th><th class="num">Actual</th><th>Variance</th><th>Status</th></tr></thead>
          <tbody>${tableRows || `<tr><td colspan="9" class="empty">${stockVarianceStatusFilter ? `No products are currently "${esc(stockVarianceStatusFilter)}".` : "No products with at least two stock takes yet."}</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

// ---------- Users ----------
function renderUsers(){
  const users = DATA.users || [];
  const roleLabel = {owner:"Owner", procurement:"Procurement", stocktaker:"Stock Taker", receiving:"Receiving", market:"Market"};
  const roleOptionsFor = (current)=> ["owner","procurement","stocktaker","receiving","market"].map(r=>
    `<option value="${r}" ${r===current?"selected":""}>${roleLabel[r]}</option>`).join("");

  const rows = users.map((u,i)=>{
    const isSelf = currentUser && currentUser.name===u.name;
    return `
    <tr>
      <td>${esc(u.name)}${isSelf ? ` <span class="helptext">(you)</span>` : ""}</td>
      <td><select class="rowinput" data-idx="${i}" data-field="role">${roleOptionsFor(u.role)}</select></td>
      <td><input class="rowinput num" data-idx="${i}" data-field="pin" value="${esc(u.pin)}" style="max-width:110px;"></td>
      <td><button class="delbtn" data-del-user="${i}" title="Remove user">✕</button></td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Users</h2><p>Who can log in, and what they can see. This is a simple access gate for your team, not encrypted security — PINs are stored in this page's own data.</p></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Add a user</h3></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Name</label><input type="text" id="newUserName" placeholder="e.g. John"></div>
          <div class="field"><label>PIN</label><input type="text" inputmode="numeric" id="newUserPin" placeholder="e.g. 1234"></div>
          <div class="field"><label>Role</label><select id="newUserRole">${roleOptionsFor("procurement")}</select></div>
          <div><button class="btn" id="addUserBtn">Add user</button></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Existing users</h3><div class="desc">${users.length} user(s). Edit role or PIN below, then save.</div></div>
        <button class="btn primary" id="saveUsersBtn">Save changes</button>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Name</th><th>Role</th><th class="num">PIN</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="4" class="empty">No users yet.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>What each role can access</h3></div></div>
      <div class="cardbody helptext">
        <strong>Owner</strong> — everything, including Users and Backup &amp; Restore. Lands on the Dashboard when logging in.<br>
        <strong>Procurement</strong> — Dashboard, Shopping List, Quick Buy, Shopping List Archive, Purchase Costs, Sage CSV, Input Stock Levels, and Receiving (can confirm deliveries too, not just see what's outstanding). Lands on the Dashboard when logging in.<br>
        <strong>Stock Taker</strong> — Input Stock Levels, and the same Receiving access as the Receiving role (can confirm deliveries, log stock with no order on file, correct received figures — but, same as Receiving, can't mark a delivery "Not received"). No Shopping List, no Dashboard.<br>
        <strong>Receiving</strong> — only the Receiving tab, to log stock as it's counted in. For staff whose only job is receiving deliveries (e.g. a night-shift hand) — they don't need or see anything else. No Dashboard. Can't mark a delivery "Not received" — that stays an Owner/Procurement call.<br>
        <strong>Market</strong> — only Quick Buy, to log what's bought at the market. For staff whose only job is buying — they don't need or see anything else. No Dashboard.
      </div>
    </div>`;
}

function renderBackup(){
  return `
    <div class="pagehead">
      <div><h2>Backup &amp; Restore</h2><p>Download a full snapshot of everything in this app, and restore from one if you ever need to. Worth doing before any big edit.</p></div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Download a backup</h3><div class="desc">Saves every tab's data — sales, item setup, recipes, calculated holdings, purchase costs, categories, stock levels — as one JSON file.</div></div>

      <div class="cardbody">
        <button class="btn primary" id="downloadBackup">Download backup (JSON)</button>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Restore from a backup</h3><div class="desc">Replaces everything currently in the app with the contents of the backup file you choose. Use this if an update ever overwrites something.</div></div>

}


function wireTabEvents(){
    if(currentTab==="home"){
    document.querySelectorAll("[data-goto-tab]").forEach(el=>{
      el.addEventListener("click", ()=>{
        setCurrentTab(el.dataset.gotoTab);
        render();
      });
    });
  }

  if(currentTab==="shoppinglist"){
    const shoppingSearchInput = document.getElementById("shoppingSearchInput");
    if(shoppingSearchInput){
      shoppingSearchInput.addEventListener("input", (e)=>{
        shoppingSearch = e.target.value;
        render();
      });
    }
    document.getElementById("shoppingStatusFilterSel").addEventListener("change", (e)=>{
      shoppingStatusFilter = e.target.value;
      render();
    });
    document.getElementById("shoppingCategoryFilterSel").addEventListener("change", (e)=>{
      shoppingCategoryFilter = e.target.value;
      render();
    });
    document.querySelectorAll("[data-stat-filter]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const status = el.dataset.statFilter;
        shoppingStatusFilter = (shoppingStatusFilter === status) ? "" : status;
        render();
      });
    });
    const boughtTodayTile = document.querySelector("[data-stat-boughttoday]");
    if(boughtTodayTile) boughtTodayTile.addEventListener("click", ()=>{
      shoppingBoughtTodayOnly = !shoppingBoughtTodayOnly;
      render();
    });
    document.querySelectorAll("[data-buy-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-buy-row]");
        const bp = container.dataset.buyRow;
        const editId = container.dataset.buyEditid || "";
        const qtyVal = container.querySelector(".buy-qty").value;
        const costVal = container.querySelector(".buy-cost").value;
        const supplierVal = (container.querySelector(".buy-supplier")||{}).value || "";
        // qty is what's actually being ordered, so it's required; cost is often genuinely not known yet
        // (e.g. herbs invoiced later) — leave it blank and it'll show as "Ordered" until Receiving fills
        // it in when the delivery is confirmed.
        if(!qtyVal){ toast("Enter a quantity to log this order"); return; }
        const today = new Date().toISOString().slice(0,10);
        const id = editId || newId();
        // logPurchase overwrites the WHOLE row on the backend (see Code.gs's upsertListRow_) — editing an
        // order that's already been confirmed received must carry its receivedQty/receivedCost/receivedBy/
        // receivedDate forward, or correcting a typo in what was ordered would silently un-receive it.
        const existingRow = editId ? DATA.purchaseCosts.find(p=> p.id===editId) : null;
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== id);
        // can't be "unable to purchase" something you're now logging as bought — mirrors what the
        // backend's logPurchase action already does server-side (see handlePurchaseAction_ in Code.gs);
        // without clearing it here too, a stale "Unable: ..." chip would keep showing next to the new
        // purchase until the next full reload
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {id, date:today, baseProduct:bp, qty:Number(qtyVal)};
        if(costVal!==""){ entry.cost = Number(costVal); } // left blank when not yet invoiced — see the comment above
        if(supplierVal.trim()) entry.supplier = supplierVal.trim();
        if(currentUser) entry.loggedBy = currentUser.name;
        if(existingRow && existingRow.receivedDate){
          entry.receivedQty = existingRow.receivedQty;
          entry.receivedCost = existingRow.receivedCost;
          entry.receivedBy = existingRow.receivedBy;
          entry.receivedDate = existingRow.receivedDate;
          entry.receivedTime = existingRow.receivedTime;
        }
        // a "not received" line being corrected here (its qty/cost typo'd at order time) must keep that
        // status too — logPurchase's full-row overwrite would otherwise silently reopen it
        if(existingRow && existingRow.notReceivedDate){
          entry.notReceivedReason = existingRow.notReceivedReason;
          entry.notReceivedBy = existingRow.notReceivedBy;
          entry.notReceivedDate = existingRow.notReceivedDate;
        }
        DATA.purchaseCosts.push(entry);
        shoppingBuyEditing.delete(bp);
        shoppingIssueEditing.delete(bp);
        // additive on the backend (touches only this one row, matched by its own id) so this can never
        // collide with someone else logging a different purchase — e.g. from Quick Buy — around the
        // same moment, and buying the same product from two suppliers today is just two separate rows.
        // This logs it as an ORDER, not an instant purchase — it stays "Ordered" until someone in
        // Receiving confirms it actually arrived (see the Receiving tab / receivePurchase in Code.gs).
        persistPurchaseAction({action:"logPurchase", entry}, "Logged order for " + bp);
      });
    });
    document.querySelectorAll("[data-buy-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.buyAddnew); // buying and "unable to buy" are mutually exclusive for the same product/day
        shoppingBuyEditing.set(btn.dataset.buyAddnew, "new");
        render();
      });
    });
    document.querySelectorAll("[data-buy-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.buyEdit);
        shoppingBuyEditing.set(btn.dataset.buyEdit, btn.dataset.buyEditId || "new");
        render();
      });
    });
    document.querySelectorAll("[data-buy-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.buyCancel);
        render();
      });
    });
    document.querySelectorAll("[data-buy-delete-id]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.buyDeleteId;
        const bp = btn.dataset.buyDeleteBp;
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== id);
        shoppingBuyEditing.delete(bp);
        persistPurchaseAction({action:"deletePurchaseLog", id}, "Deleted logged purchase for " + bp);
      });
    });
    // "Unable to purchase" on the Shopping List — mirrors Quick Buy's Unable-to-purchase form, but
    // inline in the Bought-today cell so it's visible (and editable) right from this list too.
    document.querySelectorAll("[data-issue-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.issueAddnew);
        shoppingIssueEditing.add(btn.dataset.issueAddnew);
        render();
      });
    });
    document.querySelectorAll("[data-issue-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingBuyEditing.delete(btn.dataset.issueEdit);
        shoppingIssueEditing.add(btn.dataset.issueEdit);
        render();
      });
    });
    document.querySelectorAll("[data-issue-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        shoppingIssueEditing.delete(btn.dataset.issueCancel);
        render();
      });
    });
    document.querySelectorAll("[data-issue-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-issue-row]");
        const bp = container.dataset.issueRow;
        const reason = container.querySelector(".issue-reason").value.trim();
        if(!reason){ toast("Enter a reason first"); return; }
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        // can't be "unable to purchase" something already bought (from any supplier) today
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {date:today, baseProduct:bp, reason};
        if(currentUser) entry.loggedBy = currentUser.name;
        DATA.purchaseIssues.push(entry);
        shoppingIssueEditing.delete(bp);
        shoppingBuyEditing.delete(bp);
        persistPurchaseAction({action:"logPurchaseIssue", entry}, "Logged " + bp + " as unable to purchase");
      });
    });
    document.querySelectorAll("[data-issue-delete]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const bp = btn.dataset.issueDelete;
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        shoppingIssueEditing.delete(bp);
        persistPurchaseAction({action:"deletePurchaseIssue", date:today, baseProduct:bp}, "Deleted unable-to-purchase entry for " + bp);
      });
    });
    // "Have enough stock" — a one-click alternative to "Unable to purchase": no reason to type, it
    // just logs the same canned SUFFICIENT_STOCK_REASON into purchaseIssues (see issueChipHtml), which
    // is enough on its own to drop this product off the Dashboard's "needs buying today" list too.
    document.querySelectorAll("[data-sufficient-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const bp = btn.dataset.sufficientAddnew;
        const today = new Date().toISOString().slice(0,10);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> !(p.baseProduct===bp && p.date===today));
        const entry = {date:today, baseProduct:bp, reason:SUFFICIENT_STOCK_REASON};
        if(currentUser) entry.loggedBy = currentUser.name;
        DATA.purchaseIssues.push(entry);
        shoppingIssueEditing.delete(bp);
        shoppingBuyEditing.delete(bp);
        persistPurchaseAction({action:"logPurchaseIssue", entry}, "Logged " + bp + " as having enough stock till tomorrow");
      });
    });
  }

  if(currentTab==="quickbuy"){
    if(!quickBuySelected){
      const searchInput = document.getElementById("quickBuySearchInput");
      if(searchInput){
        searchInput.addEventListener("input", (e)=>{
          quickBuySearch = e.target.value;
          render();
        });
      }
      const categorySel = document.getElementById("quickBuyCategoryFilterSel");
      if(categorySel){
        categorySel.addEventListener("change", (e)=>{
          quickBuyCategoryFilter = e.target.value;
          render();
        });
      }
      document.querySelectorAll("[data-quickbuy-pick]").forEach(b=>{
        b.addEventListener("click", ()=>{
          const bp = b.dataset.quickbuyPick;
          const today = new Date().toISOString().slice(0,10);
          // default to whichever form matches what's already logged for today, else the purchase form;
          // picking a product fresh always starts a NEW line (buying it again today, e.g. from a second
          // supplier, is normal) rather than editing whatever's already logged
          const existingIssueForPick = unableEntryForDate(bp, today);
          quickBuyMode = (existingIssueForPick && !purchaseEntriesForDate(bp, today).length)
            ? (existingIssueForPick.reason===SUFFICIENT_STOCK_REASON ? "sufficient" : "unable")
            : "buy";
          quickBuyEditingId = null;
          quickBuySelected = bp;
          render();
        });
      });
    } else {
      document.getElementById("quickBuyBack").addEventListener("click", ()=>{
        quickBuySelected = null;
        quickBuyEditingId = null;
        render();
      });
      document.querySelectorAll("[data-quickbuy-setmode]").forEach(b=>{
        b.addEventListener("click", ()=>{
          quickBuyMode = b.dataset.quickbuySetmode;
          quickBuyEditingId = null;
          render();
        });
      });
      const confirmBtn = document.getElementById("quickBuyConfirm");
      if(confirmBtn){
        confirmBtn.addEventListener("click", ()=>{
          const qtyVal = document.getElementById("quickBuyQty").value;
          const costVal = document.getElementById("quickBuyCost").value;
          const supplierVal = (document.getElementById("quickBuySupplier")||{}).value || "";
          // qty is what's actually being ordered, so it's required; cost is often genuinely not known yet
          // (e.g. herbs invoiced later) — leave it blank and it'll show as "Ordered" until Receiving fills
          // it in when the delivery is confirmed.
          if(!qtyVal){ toast("Enter a quantity to confirm"); return; }
          const today = new Date().toISOString().slice(0,10);
          const bp = quickBuySelected;
          const id = quickBuyEditingId || newId();
          // logPurchase overwrites the WHOLE row on the backend — editing an order that's already been
          // confirmed received must carry its receivedQty/receivedCost/receivedBy/receivedDate forward,
          // or correcting a typo in what was ordered would silently un-receive it.
          const existingRow = quickBuyEditingId ? DATA.purchaseCosts.find(p=> p.id===quickBuyEditingId) : null;
          DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== id);
          DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
          const entry = {id, date:today, baseProduct:bp, qty:Number(qtyVal)};
          if(costVal!==""){ entry.cost = Number(costVal); } // left blank when not yet invoiced — see the comment above
          if(supplierVal.trim()) entry.supplier = supplierVal.trim();
          if(currentUser) entry.loggedBy = currentUser.name;
          if(existingRow && existingRow.receivedDate){
            entry.receivedQty = existingRow.receivedQty;
            entry.receivedCost = existingRow.receivedCost;
            entry.receivedBy = existingRow.receivedBy;
            entry.receivedDate = existingRow.receivedDate;
            entry.receivedTime = existingRow.receivedTime;
          }
          // a "not received" line being corrected here must keep that status too — see the matching
          // comment on the Shopping List edit path above
          if(existingRow && existingRow.notReceivedDate){
            entry.notReceivedReason = existingRow.notReceivedReason;
            entry.notReceivedBy = existingRow.notReceivedBy;
            entry.notReceivedDate = existingRow.notReceivedDate;
          }
          DATA.purchaseCosts.push(entry);
          quickBuySelected = null;
          quickBuyEditingId = null;
          quickBuySearch = "";
          // additive on the backend — this is the fix for two buyers logging purchases from the market
          // at the same time: it only ever touches this one row (matched by its own id), so it can
          // never collide with, wait on, or overwrite whatever the other person is logging right now,
          // and buying the same product from two suppliers today is just two separate rows. This logs it
          // as an ORDER, not an instant purchase — see the Receiving tab / receivePurchase in Code.gs.
          persistPurchaseAction({action:"logPurchase", entry}, "Logged order for " + bp);
        });
      }
      const unableBtn = document.getElementById("quickBuyLogUnable");
      if(unableBtn){
        unableBtn.addEventListener("click", ()=>{
          const reason = document.getElementById("quickBuyReason").value.trim();
          if(!reason){ toast("Enter a reason first"); return; }
          const today = new Date().toISOString().slice(0,10);
          const bp = quickBuySelected;

    // Confirms a pending order (always visible, no toggle needed) OR saves a correction to an
    // already-received line (only reachable via data-receive-edit below) — same handler either way,
    // since both are just "submit these received-qty/received-cost inputs for this id".
    document.querySelectorAll("[data-receive-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const container = btn.closest("[data-receive-row]");
        const id = container.dataset.receiveRow;
        const qtyVal = container.querySelector(".receive-qty").value;
        const costVal = container.querySelector(".receive-cost").value;
        if(!qtyVal){ toast("Enter the quantity actually received"); return; }
        const existing = DATA.purchaseCosts.find(p=> p.id===id);
        if(!existing){ toast("That order no longer exists"); return; }
        // Captured before the mutations below — tells the auto-print at the bottom apart from a later
        // qty/cost correction on an already-received line (see printReceivingSlip call).
        const wasAlreadyReceived = isReceived(existing);
        existing.receivedQty = Number(qtyVal);
        if(costVal!==""){ existing.receivedCost = Number(costVal); } else { delete existing.receivedCost; }
        if(currentUser) existing.receivedBy = currentUser.name;
        existing.receivedDate = existing.receivedDate || new Date().toISOString().slice(0,10);
        // Shane's ask: a discrepancy needs a clock time to check against the camera system, not just a
        // date — captured once, at the moment delivery is FIRST confirmed (same preserve-on-correction
        // pattern as receivedDate above), so a later price/qty correction never overwrites the time the
        // stock actually arrived. Local (device) clock time, since that's what lines up with the cameras.
        existing.receivedTime = existing.receivedTime || new Date().toTimeString().slice(0,8);
        receivingEditing.delete(id);
        // additive on the backend (touches only this one row, by its own id) — see receivePurchase in
        // Code.gs, which merges these fields onto the existing order rather than overwriting the row,
        // so the original qty/cost/supplier/loggedBy it was ordered under are preserved.
        persistPurchaseAction({
          action:"receivePurchase", id,
          receivedQty: existing.receivedQty, receivedCost: existing.receivedCost,
          receivedBy: existing.receivedBy, receivedDate: existing.receivedDate, receivedTime: existing.receivedTime,
        }, "Marked " + existing.baseProduct + " as received");
        // Auto-print, but only on the delivery's FIRST confirmation — not on a later correction to an
        // already-received line (that's what the row's own "🖨 Print slip" button is for, on demand).
        // Printed synchronously here, before the save round-trip above resolves, so the paper slip
        // reflects the physical count immediately rather than waiting on network timing.
        // Gated behind AUTO_PRINT_RECEIVING_SLIP (currently off — printer not connected yet, see that
        // flag's comment); the manual "🖨 Print slip" button keeps working regardless.
        if(AUTO_PRINT_RECEIVING_SLIP && !wasAlreadyReceived) printReceivingSlip(id);
      });
    });
    // "Not received" on a still-pending order — the other resolution besides actually confirming
    // receipt (supplier ran out, order cancelled, wrong stock sent back, etc.), with a required reason.
    // Mirrors the Shopping List's "Unable to buy" inline reason box exactly (data-issue-addnew/
    // tick/cancel above) via receivingNotReceivedEditing instead of shoppingIssueEditing.
    document.querySelectorAll("[data-notreceived-addnew]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        receivingNotReceivedEditing.add(btn.dataset.notreceivedAddnew);
        render();
      });
    });
    document.querySelectorAll("[data-notreceived-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        receivingNotReceivedEditing.delete(btn.dataset.notreceivedCancel);
        render();
      });
    });
    document.querySelectorAll("[data-notreceived-tick]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.notreceivedTick;
        const container = btn.closest("[data-notreceived-row]");
        const reason = container.querySelector(".notreceived-reason").value.trim();
        if(!reason){ toast("Enter a reason first"); return; }
        const existing = DATA.purchaseCosts.find(p=> p.id===id);
        if(!existing){ toast("That order no longer exists"); return; }
        existing.notReceivedReason = reason;
        if(currentUser) existing.notReceivedBy = currentUser.name;
        existing.notReceivedDate = new Date().toISOString().slice(0,10);
        receivingNotReceivedEditing.delete(id);
        // additive on the backend, same shape as receivePurchase — merges onto the existing order row by
        // its own id rather than overwriting it, so the original qty/cost/supplier/loggedBy survive.
        persistPurchaseAction({
          action:"markPurchaseNotReceived", id,
          notReceivedReason: existing.notReceivedReason,
          notReceivedBy: existing.notReceivedBy,
          notReceivedDate: existing.notReceivedDate,
        }, "Marked " + existing.baseProduct + " as not received");
      });
    });
    // Reopen: clears the not-received fields so the line drops back into Pending delivery — for when it
    // was logged in error, or the supplier comes through after all.
    document.querySelectorAll("[data-notreceived-reopen]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.notreceivedReopen;
        const existing = DATA.purchaseCosts.find(p=> p.id===id);
        if(!existing){ toast("That order no longer exists"); return; }
        const bp = existing.baseProduct;
        delete existing.notReceivedReason;
        delete existing.notReceivedBy;
        delete existing.notReceivedDate;
        persistPurchaseAction({action:"reopenPurchaseNotReceived", id}, "Reopened " + bp + " to pending");
      });
    });
    document.querySelectorAll("[data-receive-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.receiveEdit;
        if(receivingEditing.has(id)) receivingEditing.delete(id); else receivingEditing.add(id);
        render();
      });
    });
    document.querySelectorAll("[data-receive-edit-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        receivingEditing.delete(btn.dataset.receiveEditCancel);
        render();
      });
    });
    // Owner-only (gated at render time in renderReceiving — isOwner()): removes a "Recently received"
    // line entirely, not just correcting its qty/cost. Reuses the same deletePurchaseLog action Purchase
    // Costs' row delete already uses on the backend — it removes exactly one purchaseCosts row by its own
    // id, whatever state (pending/received/not received) it's in, so no backend change was needed here.
    document.querySelectorAll("[data-del-received]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.delReceived;
        const existing = DATA.purchaseCosts.find(p=> p.id===id);
        if(!existing){ toast("That entry no longer exists"); return; }
        if(!confirm(`Delete this received entry for "${existing.baseProduct}"?\n\nThis removes the record entirely — it also feeds Purchase Costs and Sage CSV, so this can't be undone.`)) return;
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id!==id);
        persistPurchaseAction({action:"deletePurchaseLog", id}, "Deleted received entry for " + existing.baseProduct);
      });
    });
    // Manual reprint — available any time from a "Recently received" row, on top of the auto-print that
    // fires right when a delivery is first confirmed (see data-receive-tick below).
    document.querySelectorAll("[data-print-slip]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        printReceivingSlip(btn.dataset.printSlip);
      });
    });
    const directReceiptBtn = document.getElementById("logDirectReceipt");
    if(directReceiptBtn){
      directReceiptBtn.addEventListener("click", ()=>{
        const bp = document.getElementById("directReceiveBase").value.trim();
        const qtyVal = document.getElementById("directReceiveQty").value;
        const costVal = document.getElementById("directReceiveCost").value;
        const supplierVal = document.getElementById("directReceiveSupplier").value.trim();
        if(!bp){ toast("Enter a base product"); return; }
        if(!qtyVal){ toast("Enter the quantity received"); return; }
        const today = new Date().toISOString().slice(0,10);
        // Deliberately no entry.qty/entry.cost — there was never an order logged for this delivery, so
        // there's nothing to compare the count against. isReceived/purchaseLineChip/receivingDiscrepancy
        // all already treat a missing qty as "no order figure on file" rather than a discrepancy, and the
        // Receiving list flags it with a "no order on file" chip so it stays visible that this one
        // skipped the usual Order -> Received flow.
        const entry = {id:newId(), date:today, baseProduct:bp, receivedQty:Number(qtyVal), receivedDate:today, receivedTime:new Date().toTimeString().slice(0,8)};
        if(costVal!==""){ entry.receivedCost = Number(costVal); }
        if(supplierVal) entry.supplier = supplierVal;
        if(currentUser){ entry.loggedBy = currentUser.name; entry.receivedBy = currentUser.name; }
        DATA.purchaseCosts = DATA.purchaseCosts.filter(p=> p.id !== entry.id);
        DATA.purchaseIssues = DATA.purchaseIssues.filter(p=> !(p.baseProduct===bp && p.date===today));
        DATA.purchaseCosts.push(entry);
        persistPurchaseAction({action:"logPurchase", entry}, "Logged " + qtyVal + " " + bp + " received (no order on file)");
        // Also a delivery being confirmed for the first time (just without a prior order on file) — same
        // auto-print as the normal Pending delivery -> Received flow above, same AUTO_PRINT_RECEIVING_SLIP gate.
        if(AUTO_PRINT_RECEIVING_SLIP) printReceivingSlip(entry.id);
      });
    }
  }

      document.querySelectorAll("#main [data-idx]").forEach(inp=>{

        let val = inp.value;
        if(field==="category"){
          const val2 = val.trim();

          if(val2.toLowerCase()==="mixes"){
            // Its own field, not the shared per-Base-Product lookup — a mix has no Base Product to hang it off.

          } else if(bp){

            delete DATA.itemSetup[idx].category; // linked to a real Base Product again — drop any leftover override
          } else {
            if(val2) DATA.itemSetup[idx].category = val2;
            else delete DATA.itemSetup[idx].category;
          }
          return;

        if(field==="conversionFactor"){ val = val===""? null : Number(val); }
        DATA.itemSetup[idx][field] = val;

        if(allCategoriesWithMeta().some(c=> c.name!==oldName && c.name.toLowerCase()===newName.toLowerCase())){

        if(!DATA.categories) DATA.categories = [];

        DATA.itemSetup.forEach(it=>{ if(!it.baseProduct && it.category===oldName) it.category = newName; });

    document.querySelectorAll("[data-del-recipe]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delRecipe);
        DATA.recipes.splice(i,1);
        persist("Product mix line removed", ["recipes"]);
      });
    });
    document.getElementById("saveRecipes").addEventListener("click", ()=>{
      const rowsByIdx = {};
      document.querySelectorAll("#main [data-recidx]").forEach(inp=>{
        const idx = Number(inp.dataset.recidx);
        if(!rowsByIdx[idx]) rowsByIdx[idx] = {};
        rowsByIdx[idx][inp.dataset.field] = inp.value;
      });
      Object.keys(rowsByIdx).forEach(idxKey=>{
        const idx = Number(idxKey);
        const rec = DATA.recipes[idx];
        if(!rec) return;
        const vals = rowsByIdx[idx];
        rec.compositeItem = (vals.compositeItem||"").trim();
        rec.ingredientItem = (vals.ingredientItem||"").trim();
        const pctRaw = vals.percent;
        const fixedRaw = vals.fixedQty;
        if(pctRaw !== "" && pctRaw !== undefined){
          rec.percent = Number(pctRaw)/100;
          rec.fixedQty = null;
        } else if(fixedRaw !== "" && fixedRaw !== undefined){
          rec.fixedQty = Number(fixedRaw);
          rec.percent = null;
        } else {
          rec.percent = null;
          rec.fixedQty = null;
        }
      });
      persist("Product Mixes saved", ["recipes"]);
    });
  }

  if(currentTab==="salesdata"){
    document.getElementById("salesUploadDateInput").addEventListener("change", (e)=>{
      salesUploadDate = e.target.value || new Date().toISOString().slice(0,10);
      salesUploadDateUserSet = true; // stop the oldest-missing-date auto-default from overriding a manual pick
    });
    if(!salesPendingA) wireSalesDropzone("salesA");
    if(!salesPendingB) wireSalesDropzone("salesB");
    document.querySelectorAll("[data-clear-pending]").forEach(b=>{
      b.addEventListener("click", ()=>{
        if(b.dataset.clearPending==="salesA") salesPendingA = null; else salesPendingB = null;
        render();
      });
    });
    const submitBtn = document.getElementById("salesUploadSubmit");
    if(submitBtn) submitBtn.addEventListener("click", submitSalesUpload);
    document.querySelectorAll("[data-del-saleshistory]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const date = b.dataset.delSaleshistory;
        if(!confirm(`Delete the submitted Item Sales report for ${date}?\n\nThis removes it from the sales history archive entirely — Calculated Holdings' averages will stop counting it, and the date goes back to "missing" above. Only do this if the wrong CSV was uploaded for that date.`)) return;
        DATA.salesHistory = DATA.salesHistory.filter(h=> h.date!==date);
        persist("Removed Item Sales report for " + date, ["salesHistory"]);
      });
    });
  }

  if(currentTab==="purchase"){
    document.getElementById("purchDateFilter").addEventListener("change", (e)=>{
      purchaseDateFilter = e.target.value;
      render();
    });
    // The manual "New purchase entry" draft form (add/clear/submit a batch of typed-in lines) was
    // removed here — Shane's call: everything now comes in through Receiving, Quick Buy, or the Shopping
    // List instead, so this tab is read/audit-only apart from deleting a mistaken row below.
    document.querySelectorAll("[data-del-purchase]").forEach(b=>{
      b.addEventListener("click", ()=>{
        const i = Number(b.dataset.delPurchase);
        DATA.purchaseCosts.splice(i,1);
        persist("Purchase entry removed", ["purchaseCosts"]);
      });
    });
  }

  if(currentTab==="pricehistory"){
    const sel = document.getElementById("priceHistoryProductSel");
    if(sel) sel.addEventListener("change", (e)=>{ priceHistorySelectedProduct = e.target.value || null; render(); });
    document.querySelectorAll("[data-select-product]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        priceHistorySelectedProduct = btn.dataset.selectProduct;
        render();
      });
    });
    document.getElementById("savePriceAlertPct").addEventListener("click", ()=>{
      const raw = Number(document.getElementById("priceAlertPctInput").value);
      DATA.shoppingList.priceAlertPct = (raw>0 ? raw : 25)/100;
      persist("Alert threshold saved", ["shoppingList"]);
    });
    document.querySelectorAll("[data-price-alert-filter]").forEach(el=>{
      el.addEventListener("click", ()=>{
