    --warn:#B4790E; --warn-soft:#FBF0DC; --critical:#B23A2E; --critical-soft:#FBE6E2;
    --good:#3F6C4B; --good-soft:#E6EEE7; --shadow: 0 1px 2px rgba(32,40,33,.06), 0 4px 16px rgba(32,40,33,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14181A; --surface:#1B2022; --surface-2:#20262A; --ink:#E8E9E4; --muted:#9AA394;
      --line:#2B3230; --accent:#5C9169; --accent-ink:#0E1310; --accent-soft:#22302A;
      --warn:#D9A441; --warn-soft:#332A16; --critical:#E0685A; --critical-soft:#3A2119;
      --good:#5C9169; --good-soft:#22302A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14181A; --surface:#1B2022; --surface-2:#20262A; --ink:#E8E9E4; --muted:#9AA394;
    --line:#2B3230; --accent:#5C9169; --accent-ink:#0E1310; --accent-soft:#22302A;
    --warn:#D9A441; --warn-soft:#332A16; --critical:#E0685A; --critical-soft:#3A2119;
    --good:#5C9169; --good-soft:#22302A; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);

  }

  h1,h2,h3{font-family:"Fraunces", Georgia, serif; font-weight:600; text-wrap:balance; margin:0;}
  a{color:var(--accent);}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:216px; flex:none; background:var(--surface); border-right:1px solid var(--line);

  }

  .brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:600;font-size:16px;margin-bottom:9px;}
  .brand h1{font-size:17px; letter-spacing:.01em;}
  .brand .sub{font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:.06em;}
  nav{padding:10px; flex:1; overflow-y:auto;}
  .navbtn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 11px; border-radius:8px;
    border:none; background:transparent; color:var(--muted); font-size:13px; font-weight:500; margin-bottom:2px;
  }
  .navbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none;}
  .navbtn:hover{background:var(--surface-2); color:var(--ink);}
  .navbtn.active{background:var(--accent-soft); color:var(--accent);}
  .navbtn.active .dot{background:var(--accent);}
  .navgroup{margin-bottom:14px;}
  .navgroup:last-child{margin-bottom:0;}
  .navgrouplabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; padding:8px 11px 4px;}
  .navfoot{padding:12px 14px; border-top:1px solid var(--line); font-size:11px; color:var(--muted);}
  .synctag{display:inline-flex;align-items:center;gap:5px;}
  .synctag .pulse{width:6px;height:6px;border-radius:50%;background:var(--good);}

  .main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1320px;}
  .pagehead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
  .pagehead h2{font-size:24px;}
  .pagehead p{margin:4px 0 0; color:var(--muted); max-width:60ch; font-size:13px;}
  .actions{display:flex; gap:8px; flex-wrap:wrap;}

  .btn{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:7px; border:1px solid var(--line);
    background:var(--surface); font-size:13px; font-weight:500; color:var(--ink);
  }
  .btn:hover{border-color:var(--muted);}
  .btn:focus-visible, .navbtn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px;
  }
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{border-color:transparent; background:transparent;}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .cardrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; box-shadow:var(--shadow);}
  .stat .label{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px;}
  .stat .value{font-size:22px; font-weight:600; font-family:"IBM Plex Mono",monospace;}
  .stat .value.small{font-size:15px; font-family:"IBM Plex Sans",sans-serif; font-weight:600;}
  .stat.clickable{cursor:pointer; transition:box-shadow .12s ease, border-color .12s ease; -webkit-tap-highlight-color:transparent;}
  .stat.clickable:hover{border-color:var(--accent);}
  .stat.clickable.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft) inset, var(--shadow);}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); margin-bottom:22px;}
  .card .cardhead{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .card .cardhead h3{font-size:15px;}
  .card .cardhead .desc{font-size:12px; color:var(--muted); margin-top:2px;}
  .card .cardbody{padding:16px 18px;}

  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  input[type=text], input[type=number], input[type=date], select, textarea{
    padding:7px 9px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); width:100%;
  }
  textarea{font-family:"IBM Plex Mono",monospace; font-size:12px; min-height:160px; resize:vertical;}
  .searchbar{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:6px 10px; min-width:220px;}
  .searchbar input{border:none; background:transparent; padding:2px 0;}
  .searchbar input:focus-visible{outline:none;}

  .tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; width:100%; font-size:13px;}
  thead th{
    position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td{padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right; font-family:"IBM Plex Mono",monospace;}
  .rowinput{width:100%; min-width:90px; padding:5px 7px; font-size:12.5px; border-radius:5px; border:1px solid var(--line); background:var(--surface);}
  .rowinput:focus-visible{outline:2px solid var(--accent);}
  .rowinput:disabled{background:var(--surface-2); color:var(--muted); cursor:not-allowed;}

  /* Shane's ask: Receiving's price inputs should read as Rand values, not bare numbers. The "R" is a
     purely visual prefix laid over a plain <input type="number"> (a real "R120" isn't valid numeric
     input) — see randFieldHtml() in render_functions.js, the one place all three of these are built. */
  .rand-field{position:relative; display:inline-flex; align-items:center; width:100%;}
  .rand-field .rand-prefix{position:absolute; left:8px; color:var(--muted); font-size:12px; pointer-events:none;}
  .rand-field input{padding-left:19px; width:100%;}

  .chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap;}
  .chip.good{background:var(--good-soft); color:var(--good);}
  .chip.warn{background:var(--warn-soft); color:var(--warn);}
  .chip.critical{background:var(--critical-soft); color:var(--critical);}
  .chip.neutral{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}

  .covgrid{display:flex; flex-wrap:wrap; gap:6px;}
  .covday{width:34px; text-align:center; border-radius:8px; padding:6px 2px 5px; font-size:10.5px; line-height:1.3; border:1px solid var(--line); background:var(--surface-2); color:var(--muted);}
  .covday .dow{display:block; font-weight:600; text-transform:uppercase; font-size:9px; letter-spacing:.02em; opacity:.75;}
  .covday .num{display:block; font-weight:700; font-size:13px; margin-top:1px; font-family:"IBM Plex Mono",monospace;}
  .covday.done{background:var(--good-soft); color:var(--good); border-color:transparent;}
  .covday.missing{background:var(--critical-soft); color:var(--critical); border-color:transparent;}
  .covday.pending{background:var(--warn-soft); color:var(--warn); border-style:dashed;}

  .banner{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:9px; font-size:13px; margin-bottom:16px;}
  .banner.info{background:var(--accent-soft); color:var(--accent);}
  .banner.warn{background:var(--warn-soft); color:var(--warn);}
  .banner.critical{background:var(--critical-soft); color:var(--critical); justify-content:space-between; flex-wrap:wrap;}

  .formgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; align-items:end;}
  .empty{padding:30px 10px; text-align:center; color:var(--muted); font-size:13px;}
  .helptext{font-size:12px; color:var(--muted); line-height:1.6;}
  .kbd{font-family:"IBM Plex Mono",monospace; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px;}
  .tabsec{display:none;}
  .tabsec.active{display:block;}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:8px;
    font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s; pointer-events:none; z-index:50;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .delbtn{border:none;background:transparent;color:var(--critical);font-size:15px;padding:2px 6px;border-radius:5px;}
  .delbtn:hover{background:var(--critical-soft);}
  .dropzone{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1.5px dashed var(--line); border-radius:10px; padding:26px 16px; text-align:center;
    background:var(--surface-2); cursor:pointer; transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.dragover{border-color:var(--accent); background:var(--accent-soft);}
  .dropzone .dztitle{font-size:13px; font-weight:600; color:var(--ink);}
  .dropzone .dzsub{font-size:12px; color:var(--muted); margin-top:3px;}
  .dropzone input[type=file]{display:none;}

  .quickbuylist{display:flex; flex-direction:column; gap:8px; max-height:60vh; overflow-y:auto;}
  .quickbuyitem{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
    padding:14px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
  }
  .quickbuyitem:hover{border-color:var(--muted);}
  .quickbuyitem .qb-name{font-size:15px; font-weight:600;}
  .quickbuyitem .qb-meta{display:flex; align-items:center; gap:8px; flex:none;}
  .quickbuylogrow{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .quickbuylogrow:last-child{border-bottom:none;}

  .loginwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .loginbox{width:100%; max-width:340px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:28px 24px; text-align:center;}
  .loginmark{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-weight:600;font-size:20px;margin:0 auto 14px;}
  .loginbox h2{font-size:20px; margin-bottom:4px;}
  /* Both fields share one box spec (size, border, radius, background) so Name and PIN read as a matched
     pair — Shane's ask, after the two ended up visibly different sizes when each had its own one-off
     inline style. PIN keeps its own letter-spacing via .login-pin rather than an inline style, so nothing
     drifts out of sync with Name again. */
  .loginbox input{
    display:block; width:100%; box-sizing:border-box; text-align:center; font-size:17px;
    padding:14px; margin-top:12px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface-2); color:var(--ink);
  }
  .loginbox input.login-pin{letter-spacing:6px;}
  .loginbox input:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}

  /* First-load screen — shown the moment the page opens, before the data fetch resolves */
  .loadwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .loadscene{text-align:center; animation:loadFadeIn .5s ease both;}
  .loadring{width:72px; height:72px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;}
  .loadring::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:3px solid var(--accent-soft); border-top-color:var(--accent);
    animation:loadSpin .9s linear infinite;
  }
  .loadmark{width:44px; height:44px; border-radius:10px; background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:center; font-family:"Fraunces",serif; font-weight:600; font-size:20px;
    animation:loadPulse 1.6s ease-in-out infinite;}
  .loadscene h2{font-family:"Fraunces",serif; font-size:21px; margin:2px 0 6px;}
  .loadstatus{font-size:13px; color:var(--muted);}
  .loaddots span{display:inline-block; animation:loadDot 1.4s infinite; opacity:0;}
  .loaddots span:nth-child(2){animation-delay:.2s;}
  .loaddots span:nth-child(3){animation-delay:.4s;}
  @keyframes loadSpin{to{transform:rotate(360deg);}}
  @keyframes loadPulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.07); opacity:.85;}}
  @keyframes loadDot{0%,80%,100%{opacity:0;} 40%{opacity:1;}}
  @keyframes loadFadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* Shane's ask: a visible "the system is being updated" indicator, everywhere, for every role — shown
     for the exact duration of any save round-trip (persist() / persistPurchaseAction(), see setSyncBusy),
     which between them cover every write in the app (Shopping List, Quick Buy, Receiving, Item Setup,
     Product Mixes, Purchase Costs, Stock Take, Users, Settings, Sales upload, Backup/Restore). A small
     floating pill rather than a full-screen block, so it doesn't hide the page underneath or fight with
     the kiosk top bar/sidebar — it just sits above whichever one is showing. Counter-driven (see
     setSyncBusy) so two overlapping saves don't let the first one's finish hide the second one's spinner.*/
  .sync-overlay{
    position:fixed; top:14px; right:14px; z-index:80; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:999px;
    padding:8px 14px 8px 10px; font-size:12.5px; font-weight:500; color:var(--ink);
    opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .15s ease, transform .15s ease;
  }
  .sync-overlay.show{opacity:1; transform:translateY(0);}
  /* Receiving's kiosk top bar has its own name+Logout in that same top-right corner — push the pill
     below the bar just for that role so the two never overlap (see render()'s kiosk-offset toggle). */
  .sync-overlay.kiosk-offset{top:68px;}
  @media (max-width: 860px){
    .sync-overlay.kiosk-offset{top:60px;}
  }
  .sync-spinner{
    width:14px; height:14px; border-radius:50%; flex:none;
    border:2px solid var(--accent-soft); border-top-color:var(--accent);
    animation:loadSpin .8s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .toast{transition:none;}
    .loadring::before, .loadmark, .loaddots span, .loadscene, .sync-spinner{animation:none;}
  }
  @media (max-width: 860px){
    .app{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:relative; flex-direction:row; overflow-x:auto;}
    .brand{display:none;}
    nav{display:flex; padding:8px;}
    .navbtn{white-space:nowrap;}
    .main{padding:18px;}
  }

  /* Receiving is scoped to exactly one tab (see ROLE_TABS) and is usually a shared tablet parked at the
     dock — the sidebar has nothing to navigate to for that role, so it's hidden entirely for a genuinely
     full-screen page (see render()'s `kiosk` branch), and this slim bar takes over just Logout, which
     would otherwise have gone missing along with the sidebar footer that normally hosts it. */
  .kiosk-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 32px; margin:-26px -32px 22px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .kiosk-topbar .kiosk-brand{display:flex; align-items:center; gap:10px; font-family:"Fraunces",serif; font-weight:600; font-size:15px;}
  .kiosk-topbar .kiosk-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .kiosk-topbar .kiosk-user{font-size:12.5px; color:var(--muted); text-transform:capitalize;}
  @media (max-width: 860px){
    .kiosk-topbar{margin:-18px -18px 18px; padding:12px 18px;}
  }

  /* Receiving's printable goods-received slip (see printReceivingSlip / renderReceivingSlipHtml). Fixed
     black-on-white colors on purpose, not the theme tokens above — dark mode is for the screen, never
     for paper. Hidden on screen; @media print flips it to the only thing that prints, so the app chrome
     (sidebar, nav, whatever tab happens to be open) never ends up on the page. */
  .print-slip-area{ display:none; }
  @media print{
    body > .app, body > .toast, body > .sync-overlay{ display:none !important; }
    .print-slip-area{ display:block !important; background:#fff; color:#111; padding:24px; font-family:Arial,Helvetica,sans-serif; }
    .print-slip{ max-width:420px; margin:0 auto; }
    .print-slip h2{ margin:0 0 2px; font-size:20px; }
    .print-slip .print-slip-sub{ color:#555; font-size:12px; margin-bottom:14px; }
    .print-slip table{ width:100%; border-collapse:collapse; font-size:13px; }
    .print-slip td{ padding:5px 0; border-bottom:1px solid #ddd; vertical-align:top; }
    .print-slip td:first-child{ color:#555; width:42%; }
    .print-slip .print-slip-disc{ margin-top:12px; padding:8px 10px; border:1px solid #111; font-size:12px; font-weight:700; }
    .print-slip .print-slip-foot{ margin-top:18px; font-size:11px; color:#777; }
  }
</style>

<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">DF</div>
      <h1>Daily Fruit</h1>
      <div class="sub">Procurement &amp; costing</div>
    </div>
    <nav id="nav"></nav>
    <div class="navfoot" id="navFootArea">
      <span class="synctag"><span class="pulse"></span> <span id="syncstate">Synced</span></span>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="sync-overlay" id="syncOverlay" aria-hidden="true"><span class="sync-spinner"></span><span>Updating…</span></div>
<div class="print-slip-area" id="printSlipArea" aria-hidden="true"></div>

<script>
// Where the shared data actually lives now: a Google Apps Script Web App backed by a Google
// Sheet (see the setup docs shipped alongside this file). Every device that opens this page
// fetches fresh data from here on load, and every save posts the full current state back here —
// there's no more data baked into this HTML file itself, so this file basically never needs to
// be rebuilt just because the data changed.
const API_URL = "https://script.google.com/macros/s/AKfycbxhLGSHqhvY3XKZFyj7f0hL3yQVEzkL8bB4l33YiwQ2h-2exQ5siR6INPiL79iUY7RZ8Q/exec";

function emptyDataShape(){
  // a complete, always-safe starting shape so nothing crashes while the real fetch is in flight
  return {
    salesA: [], salesB: [], itemSetup: [], recipes: [],
    procurementPlan: {coverMultiplier:1, safetyBuffer:0, historyWindow:30},
    purchaseCosts: [], baseProductCategories: {},
    stockTakes: [], shoppingList: {criticalPct:0.25, overstockPct:1.5, priceAlertPct:0.25, buyPct:1},
    users: [{name:"Owner", pin:"1234", role:"owner"}],
    purchaseIssues: [], salesHistory: [],
    categoryBuffers: {}, productCycles: {}, productCeilings: {},
    categories: [], categoryCostBuffers: {},
  };
}

function applyDataDefaults(d){
  // fills in anything an older backup (or an older version of the backend sheet) might be
  // missing, so restoring/loading data from before a given feature existed never crashes
  if(!d.stockTakes) d.stockTakes = []; // backward-compatible default for backups predating Stock Take history
  if(!d.shoppingList) d.shoppingList = {criticalPct:0.25, overstockPct:1.5}; // backward-compatible default for backups predating the Shopping List
  if(d.shoppingList.priceAlertPct===undefined || d.shoppingList.priceAlertPct===null) d.shoppingList.priceAlertPct = 0.25; // backward-compatible default for backups/sheets predating Price History
  if(d.shoppingList.buyPct===undefined || d.shoppingList.buyPct===null) d.shoppingList.buyPct = 1; // backward-compatible default (100% = old hardcoded behavior) for backups/sheets predating the configurable Buy/OK boundary
  if(d.stockLevels){
    // migrate the earlier undated "current levels only" shape into a dated archive entry, then drop it
    const migrationDate = new Date().toISOString().slice(0,10);
    Object.keys(d.stockLevels).forEach(bp=>{
      const val = d.stockLevels[bp];
      if(val!==null && val!==undefined && val!=="" && !d.stockTakes.some(r=>r.date===migrationDate && r.baseProduct===bp)){
        d.stockTakes.push({date:migrationDate, baseProduct:bp, amount:Number(val)});
      }
    });
    delete d.stockLevels;
  }
  if(Array.isArray(d.itemSetup)){
    // one-time correction: earlier builds appended new items (from sales uploads / manual add)
    // to the end of the list instead of keeping it alphabetical — re-sort once on load, then
    // addItemRow / submitSalesUpload keep it sorted going forward.
    d.itemSetup.sort((a,b)=> (a.item||"").localeCompare(b.item||""));
  }
  if(!d.purchaseIssues) d.purchaseIssues = []; // backward-compatible default for backups predating "Unable to purchase" reasons
  if(!d.salesHistory) d.salesHistory = []; // backward-compatible default for backups predating automatic sales history archiving
  if(!d.categoryBuffers) d.categoryBuffers = {}; // backward-compatible default: per-category safety buffer % overrides (falls back to the global safety buffer when unset)
  if(!d.categoryCostBuffers) d.categoryCostBuffers = {}; // backward-compatible default: per-category cost (wastage) buffer %, Sage CSV only — distinct from categoryBuffers (a demand buffer)
  if(!d.shoppingListSnapshotDates) d.shoppingListSnapshotDates = []; // set by doGet, not saved by the app itself — defaults to empty until the nightly snapshot trigger has run at least once
  if(!d.productCycles) d.productCycles = {}; // backward-compatible default: per-product replenishment cycle length overrides (falls back to the global cover multiplier when unset)
  if(!d.productCeilings) d.productCeilings = {}; // backward-compatible default: per-product shelf-life hold ceilings (no cap when unset)
  if(!d.categories) d.categories = []; // backward-compatible default for backups predating explicit category management (name + hidden flag)
  if(!d.users || !d.users.length){
    // backward-compatible default for backups predating login — logs in as name "Owner", PIN 1234.
    // Change this immediately from the Users tab once logged in.
    d.users = [{name:"Owner", pin:"1234", role:"owner"}];
  }
  if(d.syncVersion===undefined) d.syncVersion = null; // backward-compatible default for backups/backends predating the two-tabs-open safety net
  if(d.dataVersion===undefined) d.dataVersion = null; // backward-compatible default for backups/backends predating the stale-tab refresh check
  return d;
}

function browserDownload(filename, dataStr, mime){
  const blob = new Blob([dataStr], {type: mime || "application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

// ---------- parsing helpers (mirrors the workbook's "CODE - Description - UNIT" convention) ----------
function parseItem(item){
  const parts = item.split(" - ").map(p=>p.trim());
  if(parts.length >= 3){
    return {code:parts[0], description:parts.slice(1,-1).join(" - "), unit:parts[parts.length-1]};
  } else if(parts.length === 2){
    return {code:parts[0], description:parts[1], unit:""};
  }
  return {code:item, description:"", unit:""};
}

// ---------- derived computations (mirror the spreadsheet formulas) ----------
function combinedSalesMap(){
  const map = {};
  for(const row of [...DATA.salesA, ...DATA.salesB]){
    if(!row.item) continue;
    if(!map[row.item]) map[row.item] = {qty:0, cost:0, selling:0};
    map[row.item].qty += Number(row.qty)||0;
    map[row.item].cost += Number(row.cost)||0;
    map[row.item].selling += Number(row.selling)||0;
  }
  return map;
}

function recipeDrivenMap(combined){
  const map = {};
  for(const rec of DATA.recipes){
    if(!rec.compositeItem || !rec.ingredientItem) continue;
    const compQty = (combined[rec.compositeItem]||{}).qty || 0;
    const factor = (rec.percent !== null && rec.percent !== undefined && rec.percent !== "") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    map[rec.ingredientItem] = (map[rec.ingredientItem]||0) + compQty*factor;
  }
  return map;
}

function recipeCompositeTotals(){
  const totals = {};
  for(const rec of DATA.recipes){
    if(!rec.compositeItem) continue;
    if(rec.percent !== null && rec.percent !== undefined && rec.percent !== ""){
      totals[rec.compositeItem] = (totals[rec.compositeItem]||0) + Number(rec.percent);
    }
  }
  return totals;
}

function itemSetupDerived(){
  const combined = combinedSalesMap();
  const recipeDriven = recipeDrivenMap(combined);
  return DATA.itemSetup.map(it=>{
    const c = combined[it.item] || {qty:0,cost:0,selling:0};
    const recQty = recipeDriven[it.item] || 0;
    const conv = (it.conversionFactor===""||it.conversionFactor===null||it.conversionFactor===undefined) ? null : Number(it.conversionFactor);
    const rawNeeded = (conv && conv!==0) ? (c.qty+recQty)/conv : null;
    return Object.assign({}, it, {combinedQty:c.qty, combinedCost:c.cost, combinedSelling:c.selling, recipeQty:recQty, rawNeeded});
  });
}

// ---------- Sales history (multi-day demand archive) ----------
// Every time a sales CSV is ingested (from either company — Pyroca or DF Veg) we archive a dated
// snapshot of per-base-product demand (in procurement units, using whatever conversion factors were
// set up at the time), tagged with the date it was uploaded for (see salesUploadDate) so daily
// uploads — or backdated historical reports — each land on their own day instead of overwriting one
// another. This builds up automatically instead of Calculated Holdings relying on whatever single
// report happens to be loaded right now.
const DEMAND_HISTORY_WINDOW = 30; // fallback default if the owner hasn't set one (see demandHistoryWindow())

// Owner-adjustable on Calculated Holdings: a shorter window adapts faster to a seasonal turn (fresh
// produce demand shifts through the year) at the cost of noisier day-to-day recommendations; a longer
// one smooths things out but takes longer to fully forget an old season's numbers. Falls back to the
// default above for data saved before this setting existed, or if it's ever cleared/invalid.
function demandHistoryWindow(){
  const v = Number(DATA.procurementPlan.historyWindow);
  return (v && v>0) ? Math.round(v) : DEMAND_HISTORY_WINDOW;
}

function currentDemandSnapshot(){
  const derived = itemSetupDerived();
  const byBase = {};
  for(const it of derived){
    if(!it.baseProduct) continue;
    (byBase[it.baseProduct] = byBase[it.baseProduct]||[]).push(it);
  }
  const snap = {};
  for(const baseProduct of Object.keys(byBase)){
    const matches = byBase[baseProduct];
    const hasRaw = matches.some(it=>it.rawNeeded!==null);
    if(!hasRaw) continue; // skip products that don't have a usable conversion factor yet — don't record a misleading 0
    // floor at 0: a heavy-return/credit-note day can make raw sales minus returns net negative for a
    // product, but "demand" can never be meaningfully negative — letting a negative value into the
    // history would drag the mean+stdev estimate down and risk understocking, the opposite of the point
    snap[baseProduct] = Math.max(0, matches.reduce((s,it)=> s + (it.rawNeeded||0), 0));
  }
  return snap;
}

function archiveSalesSnapshot(forDate){
  // one archived entry per tagged date: uploading Pyroca then DF Veg for the same date
  // refreshes that date's entry (using the latest combined view) rather than double-counting it.
  // Pass a past date (via salesUploadDate) to backdate a historical report into the archive.
  const date = forDate || new Date().toISOString().slice(0,10);
  const demand = currentDemandSnapshot();
  const existing = DATA.salesHistory.find(h=>h.date===date);
  if(existing){ existing.demand = demand; }
  else { DATA.salesHistory.push({date, demand}); }
}

function baseProductDemandHistory(baseProduct){
  const points = DATA.salesHistory
    .filter(h => h.demand && Object.prototype.hasOwnProperty.call(h.demand, baseProduct))
    .sort((a,b)=> a.date.localeCompare(b.date))
    .map(h=> h.demand[baseProduct]);
  return points.slice(-demandHistoryWindow());
}

function demandStatsFor(baseProduct, currentRawUnits){
  const hist = baseProductDemandHistory(baseProduct);
  // fall back to the single current-period figure when there's no archived history yet
  // (e.g. right after upgrading, before any upload has been archived).
  const values = hist.length ? hist : (currentRawUnits!==null && currentRawUnits!==undefined ? [currentRawUnits] : []);
  const n = values.length;
  if(!n) return {avg:null, stdev:0, periods:0};
  const avg = values.reduce((s,v)=>s+v,0)/n;
  const variance = n>1 ? values.reduce((s,v)=> s+Math.pow(v-avg,2),0)/(n-1) : 0;
  return {avg, stdev:Math.sqrt(variance), periods:n};
}

// Category safety buffer: owner-set per category, falling back to the global safety buffer when unset.
function categoryBufferFor(categoryKey){
  const key = categoryKey || "Uncategorized";
  const v = DATA.categoryBuffers ? DATA.categoryBuffers[key] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return Number(DATA.procurementPlan.safetyBuffer)||0;
}
// Category COST buffer: an owner-set % markup on top of average cost, to account for wastage/shrink.
// Used only by the Sage CSV export (see applyCostBuffers_/sageImportComputed below) — completely
// separate from categoryBufferFor above, which is a demand/safety-stock buffer for Calculated Holdings.
// Unlike that one, there's no sensible global default here, so an unset category just gets 0%.
function categoryCostBufferFor(categoryKey){
  const key = categoryKey || "Uncategorized";
  const v = DATA.categoryCostBuffers ? DATA.categoryCostBuffers[key] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return 0;
}
// Replenishment cycle length (in archived periods) for a product: how many periods of cover to hold
// before the next restock. Falls back to the global cover multiplier when a product has no override,
// since cycle length varies product to product (some restock weekly, some twice a week).
function cycleFor(baseProduct){
  const v = DATA.productCycles ? DATA.productCycles[baseProduct] : undefined;
  if(v!==undefined && v!==null && v!=="") return Number(v);
  return Number(DATA.procurementPlan.coverMultiplier)||1;
}
// Optional shelf-life ceiling: a hard cap on the recommended hold quantity so a statistically-driven
// buffer never recommends more than the product can safely hold before it spoils.
function ceilingFor(baseProduct){
  const v = DATA.productCeilings ? DATA.productCeilings[baseProduct] : undefined;
  return (v===undefined||v===null||v==="") ? null : Number(v);
}

function procurementPlanComputed(){
  const derived = itemSetupDerived();
  const byBase = {};
  for(const it of derived){
    if(!it.baseProduct) continue;
    (byBase[it.baseProduct] = byBase[it.baseProduct]||[]).push(it);
  }
  // auto-populated: every base product that exists in Item Setup, always — nothing to add/remove manually
  return distinctBaseProducts().map(baseProduct=>{
    const matches = byBase[baseProduct] || [];
    const rawUnits = Math.max(0, matches.reduce((s,it)=> s + (it.rawNeeded||0), 0)); // floor: see currentDemandSnapshot
    const hasRaw = matches.some(it=>it.rawNeeded!==null);
    const category = categoryFor(baseProduct);
    const categoryKey = category || "Uncategorized";
    const stats = demandStatsFor(baseProduct, hasRaw ? rawUnits : null);
    const cm = cycleFor(baseProduct);
    const sb = categoryBufferFor(categoryKey);
    // demand estimate = average per-period demand + one standard deviation of spread across recent
    // periods, so irregular/inconsistent ordering automatically earns a bigger cushion than steady demand does.
    const demandEstimate = stats.avg===null ? null : (stats.avg + stats.stdev);
    let recommended = (demandEstimate!==null) ? Math.ceil(demandEstimate*cm*(1+sb)) : null;
    const ceiling = ceilingFor(baseProduct);
    const cappedByCeiling = (recommended!==null && ceiling!==null && recommended>ceiling);
    if(cappedByCeiling) recommended = ceiling;
    const units = Array.from(new Set(matches.map(it=>it.procurementUnit).filter(Boolean)));
    const procUnit = units[0] || "";
    const consistency = units.length > 1 ? "Check units differ" : "OK";
    const missing = matches.some(it => ((it.combinedQty>0 || it.recipeQty>0) && !it.conversionFactor)) ? "Missing conversion factor" : "OK";
    return {baseProduct, rawUnits, recommended, procUnit, consistency, missing, itemCount:matches.length, category,
      historyPeriods:stats.periods, avgDemand:stats.avg, demandStdev:stats.stdev, cycleUsed:cm, bufferUsed:sb,
      ceiling, cappedByCeiling};
  });
}

function latestStockTakeMap(){
  // most recent stock take entry per base product — ISO (YYYY-MM-DD) dates sort lexicographically,
  // so a plain string comparison is enough to find the latest one.
  const map = {};
  for(const r of DATA.stockTakes){
    if(!r.baseProduct) continue;
    if(!map[r.baseProduct] || r.date > map[r.baseProduct].date){
      map[r.baseProduct] = {amount:Number(r.amount), date:r.date};
    }
  }
  return map;
}


function shoppingListComputed(){
  // compares each base product's most recent stock take against its Calculated Holdings target
  const plan = procurementPlanComputed();
  const stockMap = latestStockTakeMap();
  const critPct = Number(DATA.shoppingList.criticalPct)||0.25;
  const overPct = Number(DATA.shoppingList.overstockPct)||1.5;
  const buyPct = Number(DATA.shoppingList.buyPct)||1; // ratio below which stock still counts as "Buy" (Consider Buying); at/above it, and below the overstock threshold, it's OK — defaults to 100% (old hardcoded behavior)
  const rows = plan.map(row=>{
    const stockEntry = stockMap[row.baseProduct] || null;
    const currentStock = stockEntry ? stockEntry.amount : null;
    const stockDate = stockEntry ? stockEntry.date : null;
    const recommended = row.recommended;
    let status, toBuy = null, ratio = null;
    if(recommended === null){
      status = "Missing setup"; // no computable holding target yet (e.g. missing conversion factor)
    } else if(recommended === 0){
      status = (currentStock!==null && currentStock>0) ? "Overstocked" : "OK"; // no demand right now
    } else if(currentStock === null){
      status = "No stock take"; // can't compare without a count
    } else {
      ratio = currentStock / recommended;
      if(ratio <= critPct) status = "Critical";
      else if(ratio < buyPct) status = "Buy";
      else if(ratio >= overPct) status = "Overstocked";
      else status = "OK";
      toBuy = Math.max(0, Math.ceil(recommended - currentStock));
    }
    return Object.assign({}, row, {currentStock, stockDate, status, toBuy, ratio});
  });
  // Sorted by % of stock ascending — lowest stock (0%) at the top, fullest (100%+) at the bottom — so
  // the most urgent restocking is always what you see first. A row with no computable % at all (no
  // stock take yet, or missing setup) can't be placed on that scale, so those sit at the very top,
  // above 0%, since not even knowing the stock level is at least as urgent as being empty.
  rows.sort((a,b)=>{
    const aHas = a.ratio!==null && a.ratio!==undefined;
    const bHas = b.ratio!==null && b.ratio!==undefined;
    if(aHas !== bHas) return aHas ? 1 : -1;
    if(aHas && a.ratio !== b.ratio) return a.ratio - b.ratio;
    return a.baseProduct.localeCompare(b.baseProduct);
  });
  return rows;
}

// ---------- Stock Variance (shrinkage) ----------
// Owner-only diagnostic (see NAV/ROLE_TABS): for each base product, compares its two most recent Stock
// Take counts — an opening count and a closing count — against everything Purchase Costs says came IN
// between them and everything the sales reports say went OUT, to see whether the numbers actually add
// up. Whatever's short is shrinkage; whatever's over is a surplus (miscounts happen too, in both
// directions). Nothing new to enter for this — it's built entirely from Stock Take, Receiving and Item
// Sales data that already exists for other reasons.
//
// Window convention: "in between" means dated strictly AFTER the opening count's date, through and
// including the closing count's date — the opening count is treated as the position at the START of
// that day, before that day's activity, so its own day's purchases/sales aren't double-counted.
//
// The one thing this can't do anything about: if even one day inside that window has no Item Sales
// report uploaded (or the product had no usable conversion factor set up that day — see
// itemSetupDerived), there's no way to know what actually sold that day, so the whole window is marked
// "Incomplete data" rather than showing a number that's silently wrong. See isoDatesBetween below.

// Every calendar date strictly after startExclusive, up to and including endInclusive.
function isoDatesBetween(startExclusive, endInclusive){
  const out = [];
  const d = new Date(startExclusive + "T00:00:00Z");
  const end = new Date(endInclusive + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+1);
  while(d <= end){
    out.push(d.toISOString().slice(0,10));
    d.setUTCDate(d.getUTCDate()+1);
  }
  return out;
}

function stockVarianceComputed(){
  // date -> that day's archived per-base-product demand snapshot (see archiveSalesSnapshot) — frozen
  // using whatever conversion factors were set up on the day it was archived.
  const salesByDate = {};
  DATA.salesHistory.forEach(h=>{ salesByDate[h.date] = h.demand || {}; });

  const rows = distinctBaseProducts().map(baseProduct=>{
    const takes = DATA.stockTakes.filter(r=>r.baseProduct===baseProduct).slice().sort((a,b)=> a.date.localeCompare(b.date));
    if(takes.length < 2){
      return {baseProduct, status:"Not enough stock takes", takesCount: takes.length};
    }
    const opening = takes[takes.length-2];
    const closing = takes[takes.length-1];
    const windowDates = isoDatesBetween(opening.date, closing.date);
    // a date is usable for this product only if that day's report was uploaded AND this specific
    // product had a computable demand figure that day (see itemSetupDerived — a product missing a
    // conversion factor at the time doesn't get an entry, even on a day that was otherwise uploaded)
    const missingDates = windowDates.filter(d => !(salesByDate[d] && Object.prototype.hasOwnProperty.call(salesByDate[d], baseProduct)));
    const purchasesInWindow = DATA.purchaseCosts
      .filter(p=> p.baseProduct===baseProduct && isReceived(p) && p.receivedDate > opening.date && p.receivedDate <= closing.date)
      .reduce((s,p)=> s + (Number(p.receivedQty)||0), 0);
    if(missingDates.length){
      return {baseProduct, status:"Incomplete data", openingDate:opening.date, closingDate:closing.date,
        opening:Number(opening.amount), closing:Number(closing.amount), purchasesInWindow, missingDates};
    }
    const salesUsage = windowDates.reduce((s,d)=> s + (Number(salesByDate[d][baseProduct])||0), 0);
    const expectedClosing = Number(opening.amount) + purchasesInWindow - salesUsage;
    const variance = Number(closing.amount) - expectedClosing;
    const variancePct = expectedClosing > 0 ? variance/expectedClosing : (variance===0 ? 0 : null);
    return {baseProduct, status:"Computed", openingDate:opening.date, closingDate:closing.date,
      opening:Number(opening.amount), closing:Number(closing.amount), purchasesInWindow, salesUsage,
      expectedClosing, variance, variancePct, windowDays: windowDates.length};
  });

  // Worst shrinkage first (most negative variance), then surplus/balanced, then the two "can't tell yet"
  // buckets — same "most urgent first, never hide a row" spirit as shoppingListComputed's own sort.
  rows.sort((a,b)=>{
    const rank = r => r.status==="Computed" ? 0 : r.status==="Incomplete data" ? 1 : 2;
    const ra = rank(a), rb = rank(b);
    if(ra!==rb) return ra-rb;
    if(ra===0 && a.variance!==b.variance) return a.variance - b.variance;
    return a.baseProduct.localeCompare(b.baseProduct);
  });
  return rows;
}
// Classifies a "Computed" row against the (view-only, not persisted — see stockVarianceFlagPct)
// tolerance threshold: small variances are normal counting noise, not real shrinkage.
function stockVarianceClass(row, flagPct){
  if(row.status!=="Computed") return row.status;
  const pct = row.variancePct;
  const overThreshold = pct!==null ? Math.abs(pct)>=flagPct : Math.abs(row.variance)>0.0001;
  if(!overThreshold) return "Balanced";
  return row.variance < 0 ? "Shrinkage" : "Surplus";
}

// Buying the same base product from two different suppliers on the same day is normal (that's the
// whole point of multi-line purchase logging), so "the cost" for a base product on a given day is a
// quantity-weighted average across every line logged for it that day, not just one line's price.
// A line with no qty logged can't be weighted, so it falls back to being the map's answer only when
// nothing else with a qty exists for that base product+date (better than silently dropping it).
// Only RECEIVED lines count, and only their RECEIVED figures — an order still awaiting delivery (see
// isReceived below) doesn't have final numbers yet (cost especially: often genuinely unknown until
// Receiving fills it in), so it's excluded entirely rather than costed on a provisional/blank figure.
function weightedCostMap_(entries){
  const sums = {}; // baseProduct -> {costQty, qty, fallbackCost}
  for(const p of entries){
    if(!p.baseProduct || !isReceived(p)) continue;
    const qty = Number(p.receivedQty)||0;
    const cost = Number(p.receivedCost)||0;
    if(!sums[p.baseProduct]) sums[p.baseProduct] = {costQty:0, qty:0, fallbackCost:cost};
    if(qty>0){ sums[p.baseProduct].costQty += qty*cost; sums[p.baseProduct].qty += qty; }
    else sums[p.baseProduct].fallbackCost = cost; // last qty-less line wins as the fallback, same spirit as the old "latest wins"
  }
  const map = {};
  Object.keys(sums).forEach(bp=>{
    const s = sums[bp];
    map[bp] = round2(s.qty>0 ? s.costQty/s.qty : s.fallbackCost);
  });
  return map;
}

function purchaseCostMap(date){
  // weighted-average cost per base product across every RECEIVED line ordered on this exact date;
  // omit the date to weight across every line ever logged, any date. A same-day purchase whose delivery
  // hasn't been confirmed yet by Receiving won't show a cost here until it is — see weightedCostMap_.
  const entries = date ? DATA.purchaseCosts.filter(p=> p.date===date) : DATA.purchaseCosts;
  return weightedCostMap_(entries);
}

// All purchase LINES logged for a base product on a given date (there can be more than one — different
// suppliers, different prices — since multi-supplier same-day buying was added). Regardless of received
// status — this is used for DISPLAYING what's ordered/received on Shopping List/Quick Buy, not costing.
function purchaseEntriesForDate(baseProduct, date){
  return DATA.purchaseCosts.filter(p=> p.baseProduct===baseProduct && p.date===date);
}

function unableEntryForDate(baseProduct, date){
  return DATA.purchaseIssues.find(p=> p.baseProduct===baseProduct && p.date===date) || null;
}

// A purchase line is "received" once the Receiving role (or Owner) has confirmed it actually arrived —
// see receivePurchase in Code.gs. Every pre-existing row (from before this Order -> Received workflow
// existed) was backfilled server-side (backfillPurchaseCostsAsReceived) to already carry a receivedDate,
// so a missing one here unambiguously means a genuinely open order, never just old data.
function isReceived(p){
  return !!p.receivedDate;
}

// A pending order the Receiving role has confirmed will NOT be arriving as ordered (supplier ran out,
// order cancelled, wrong item sent back, etc.) — logged with a reason so it's clear why, instead of just
// sitting in "Pending delivery" forever or getting quietly deleted with no record. Mutually exclusive
// with isReceived (marking one clears the other — see data-receive-tick and data-notreceived-tick in
// wire_events.js): a line is either still open, received, or resolved as not received.
function isNotReceived(p){
  return !!p.notReceivedDate;
}

// Flags when what actually arrived differs from what was ordered — surfaced on the Receiving tab and
// summarized on the Dashboard, so a short delivery or a corrected price doesn't just quietly slip by.
// Only compares a figure when the ORDERED side was actually known — cost is often genuinely blank at
// order time (e.g. herbs invoiced later), and that's expected, not a discrepancy.
function receivingDiscrepancy(p){
  if(!isReceived(p)) return null;
  const qtyKnown = p.qty!==undefined && p.qty!==null && p.qty!=="";
  const costKnown = p.cost!==undefined && p.cost!==null && p.cost!=="";
  const qtyDiff = qtyKnown && Number(p.qty)!==Number(p.receivedQty);
  const costDiff = costKnown && Number(p.cost)!==Number(p.receivedCost);
  if(!qtyDiff && !costDiff) return null;
  return {qtyDiff, costDiff};
}

// Shane, 2026-09: printer isn't hooked up yet, so the automatic print-on-confirm is off for now — it
// was popping the print dialog on every single receive, which got annoying with no printer to catch it.
// The manual "🖨 Print slip" button (data-print-slip, on every Recently received row) is NOT gated by

// Prints a physical goods-received slip for one confirmed delivery — Shane's ask. Looks the record up

// The always-current cost per base product — a weighted average across every line sharing the MOST
// RECENT date logged for that base product (previously just grabbed whichever single row was logged
// last; multiple suppliers on the same day needs a genuine weighted average instead of picking one
// arbitrarily). Used to keep a Product Mix's cost current any time an ingredient's price changes — not
// tied to any single day's Sage export.
function latestPurchaseCostMap(){
  const latestDate = {}; // baseProduct -> most recent RECEIVED date seen
  for(const p of DATA.purchaseCosts){
    if(!p.baseProduct || !isReceived(p)) continue; // an order still awaiting delivery has no final cost yet — skip it so an OLDER received price isn't shadowed by a pending one with nothing to offer
    if(!latestDate[p.baseProduct] || (p.date||"") >= latestDate[p.baseProduct]) latestDate[p.baseProduct] = p.date||"";
  }
  const entries = DATA.purchaseCosts.filter(p=> p.baseProduct && (p.date||"")===latestDate[p.baseProduct]);
  return weightedCostMap_(entries);
}

// ---------- Price History / price-movement alerts ----------
// One point per day this product was actually received (weighted-average cost across every received
// line that day, same math as weightedCostMap_ — a line with no cost logged yet can't be plotted, so it's
// skipped rather than shown as a false $0). Points are sorted oldest-first, and each one (after the
// first) carries changePct — the % move from the PREVIOUS received price, up or down — and alert, set to
// "up"/"down" once |changePct| clears DATA.shoppingList.priceAlertPct, or null otherwise. This is
// purchase-over-purchase, not calendar-day-over-day: two deliveries a week apart compare directly, with
// nothing in between counted as a "move".
function priceHistoryForProduct(baseProduct){
  const byDate = {}; // receivedDate -> {costQty, qty, fallbackCost}
  DATA.purchaseCosts.forEach(p=>{
    if(p.baseProduct!==baseProduct || !isReceived(p)) return;
    const d = p.receivedDate;
    const cost = Number(p.receivedCost);
    if(!d || p.receivedCost===undefined || p.receivedCost===null || p.receivedCost==="" || isNaN(cost)) return; // nothing to plot without a cost
    const qty = Number(p.receivedQty)||0;
    if(!byDate[d]) byDate[d] = {costQty:0, qty:0, fallbackCost:cost};
    if(qty>0){ byDate[d].costQty += qty*cost; byDate[d].qty += qty; }
    else byDate[d].fallbackCost = cost;
  });
  const alertPct = Number(DATA.shoppingList.priceAlertPct)||0.25;
  const points = Object.keys(byDate).sort().map(d=>{
    const s = byDate[d];
    return {date:d, cost: round2(s.qty>0 ? s.costQty/s.qty : s.fallbackCost)};
  });
  points.forEach((pt,i)=>{
    if(i===0){ pt.changePct = null; pt.alert = null; return; }
    const prev = points[i-1].cost;
    pt.changePct = prev>0 ? (pt.cost-prev)/prev : null;
    pt.alert = (pt.changePct!==null && Math.abs(pt.changePct)>=alertPct) ? (pt.changePct>0?"up":"down") : null;
  });
  return points;
}

// Every base product with at least one price movement flagged within the last `days`, most extreme
// move first — the "what actually needs a look" list, for both the Price History page and the Dashboard.
// Only the LATEST point on a product's history can trigger an alert here (an old spike that's since
// settled back down isn't a current concern), and only if that latest point itself falls in the window.
function recentPriceAlerts(days){
  const cutoff = new Date(Date.now() - days*86400000).toISOString().slice(0,10);
  const names = Array.from(new Set(DATA.purchaseCosts.filter(p=>p.baseProduct && isReceived(p)).map(p=>p.baseProduct)));
  const alerts = [];
  names.forEach(bp=>{
    const hist = priceHistoryForProduct(bp);
    const last = hist[hist.length-1];
    if(last && last.alert && last.date>=cutoff){
      alerts.push({baseProduct:bp, date:last.date, cost:last.cost, prevCost:hist[hist.length-2].cost, changePct:last.changePct, direction:last.alert});
    }
  });
  alerts.sort((a,b)=> Math.abs(b.changePct) - Math.abs(a.changePct));
  return alerts;
}

// Cost per unit of any Item Setup row, given a base-product cost lookup (either a specific date's
// purchaseCostMap(), or the always-current latestPurchaseCostMap()). Directly-purchased items divide
// their base product's cost by the conversion factor, same as before. A Product Mix (composite) item
// has no purchase cost of its own — instead its cost is the ingredients' costs combined per the recipe
// (% of composite, or a fixed qty per unit), so it automatically reflects the latest ingredient prices
// without needing its own entry. Recurses for a mix-of-mixes; `visiting` guards against a circular
// mix reference. Returns null if the cost can't be fully determined (missing a base cost somewhere
// in the chain), rather than silently under-costing the mix.
//
// `opts.latestPm`: a second-chance cost map, consulted only for a Product Mix's ingredients (once
// recursion is inside a mix's ingredient list — see `insideComposite:true` on the recursive call below,
// which also covers a nested mix-of-mixes) and only when `pm` (the primary/date-scoped map) doesn't
// have that ingredient's base product at all — pm is always tried FIRST, so a genuinely same-day price
// is still preferred over an older one when both exist. Product Mixes' own costing (compositeMixCosts
// below) already passes a latestPurchaseCostMap()-based `pm` as the PRIMARY map and no `opts`, so it's
// unaffected by any of this — it was always "latest-known" for every lookup. Sage CSV
// (sageImportComputed) is the one caller that passes a date-scoped `pm` as primary plus `latestPm` as
// the mix-ingredient fallback — Shane's report: a Product Mix like Fruit Salad has several ingredients
// that are rarely all purchased on the very same day, so requiring every one of them to have a fresh
// same-day cost meant the mix almost never priced at all in Sage CSV even though Product Mixes showed a
// perfectly good cost for it. A non-mix item passed to this function directly still requires a same-day
// cost, unchanged — only a Product Mix's ingredients get the latest-known fallback, and only for
// whichever ingredients actually need it. `opts.usedFallback` (a {value:false} box, shared across the
// whole recursion) is flipped to true the moment any leaf is priced from latestPm rather than pm, so the
// caller can tell a "built on at least one older price" result apart from a fully fresh same-day one.
function itemCostPerUnit(itemName, pm, visiting, opts){
  visiting = visiting || new Set();
  opts = opts || {};
  if(visiting.has(itemName)) return null;
  const latestPm = opts.latestPm;
  const usedFallback = opts.usedFallback;
  const it = DATA.itemSetup.find(x=>x.item===itemName);
  if(it && it.baseProduct && it.conversionFactor){
    if(it.baseProduct in pm){
      return round2(Number(pm[it.baseProduct])/Number(it.conversionFactor));
    }
    if(opts.insideComposite && latestPm && it.baseProduct in latestPm){
      if(usedFallback) usedFallback.value = true;
      return round2(Number(latestPm[it.baseProduct])/Number(it.conversionFactor));
    }
  }
  const lines = DATA.recipes.filter(r=> r.compositeItem===itemName && r.ingredientItem);
  if(!lines.length) return null;
  visiting.add(itemName);
  let total = 0;
  for(const rec of lines){
    const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    const ingCost = itemCostPerUnit(rec.ingredientItem, pm, visiting, {latestPm, usedFallback, insideComposite:true});
    if(ingCost===null){ visiting.delete(itemName); return null; }
    total += factor*ingCost;
  }
  visiting.delete(itemName);
  return round2(total);
}

// Applies each base product's category cost (wastage) buffer on top of a purchase cost map — Sage CSV
// only. Scaling the base-product costs before they reach itemCostPerUnit means a Product Mix's cost
// automatically inherits its ingredients' buffered costs through that function's existing recursion,
// with no special-casing needed here for composite items.
function applyCostBuffers_(pm){
  const out = {};
  Object.keys(pm).forEach(bp=>{
    const buf = categoryCostBufferFor(categoryFor(bp));
    out[bp] = buf ? round2(pm[bp] * (1 + buf)) : pm[bp];
  });
  return out;
}

function sageImportComputed(date){
  const derived = itemSetupDerived();
  const pm = applyCostBuffers_(purchaseCostMap(date));
  // Fallback for a Product Mix's ingredients only (see itemCostPerUnit above) — a plain, non-mix item
  // is unaffected and still needs a same-day purchase cost to price at all.
  const latestPm = applyCostBuffers_(latestPurchaseCostMap());
  return derived.map(it=>{
    const usedFallback = {value:false};
    const newCost = itemCostPerUnit(it.item, pm, undefined, {latestPm, usedFallback});
    return {
      itemCode: it.itemCode, averageCost: newCost,
      quantityOnHand: 0,
      item: it.item, baseProduct: it.baseProduct, purchasedOnDate: newCost !== null,
      // true only for a Product Mix priced via at least one ingredient's latest-known cost rather than
      // this exact date's — surfaced as a small note on the row so it's clear the figure isn't
      // necessarily built from today's purchases, without hiding or excluding it either.
      costFromLatest: newCost !== null && usedFallback.value,
    };
  });
}

// Every distinct Product Mix (composite item), with its currently-computed cost per unit — based on
// the latest known cost of each ingredient, not scoped to any one day — plus a breakdown so it's clear
// exactly which ingredient prices it's built from, and a flag when an ingredient has no cost yet.
function compositeMixCosts(){
  const pm = latestPurchaseCostMap();
  const names = Array.from(new Set(DATA.recipes.map(r=>r.compositeItem).filter(Boolean)));
  return names.map(compositeItem=>{
    const lines = DATA.recipes.filter(r=> r.compositeItem===compositeItem && r.ingredientItem);
    const breakdown = lines.map(rec=>{
      const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
      const ingCost = itemCostPerUnit(rec.ingredientItem, pm);
      return {
        ingredientItem: rec.ingredientItem, isPercent: (rec.percent!==null && rec.percent!==undefined && rec.percent!==""),
        factor, ingredientCost: ingCost, contribution: ingCost!==null ? round2(factor*ingCost) : null,
      };
    });
    const complete = breakdown.every(b=> b.contribution!==null);
    const cost = complete ? round2(breakdown.reduce((s,b)=>s+b.contribution,0)) : null;
    return {compositeItem, cost, breakdown, complete};
  });
}

// ---------- persistence ----------
// Fetches the full shared state from the backend. Uses text/plain-free plain GET (no custom
// headers) so this never triggers a CORS preflight against the Apps Script endpoint.
async function loadData(){
  if(!API_URL || API_URL.indexOf("__")===0){
    throw new Error("This copy of the app has no data source configured yet.");
  }
  const res = await fetch(API_URL, {cache: "no-store"});
  if(!res.ok) throw new Error("Server returned " + res.status);
  const fresh = await res.json();
  return applyDataDefaults(fresh);
}

// Fetches one day's archived Shopping List snapshot on demand (see Code.gs's doGet handling of
// ?action=shoppingListSnapshot) — not part of the main data load, since snapshot history can grow to a
// lot of rows over many days and most sessions never open the Archive tab at all. No synchronous
// render() call anywhere in this function on purpose: it's invoked from inside wireTabEvents (which
// runs at the end of every render()), and calling render() again before the first await would re-enter
// render() while the current one is still on the call stack — everything here happens after the await,
// so the eventual render() is always a fresh call, never a nested one.
async function loadShoppingArchive(date){
  try{
    const res = await fetch(API_URL + "?action=shoppingListSnapshot&date=" + encodeURIComponent(date), {cache: "no-store"});
    if(!res.ok) throw new Error("Server returned " + res.status);
    const result = await res.json();
    if(!result.ok) throw new Error(result.error || "Could not load that day's list");
    if(date === shoppingArchiveDate){ shoppingArchiveRows = result.rows || []; shoppingArchiveError = ""; }
  }catch(e){
    if(date === shoppingArchiveDate){ shoppingArchiveError = "Could not load that day's Shopping List — check your connection and try again."; shoppingArchiveRows = []; }
  }
  if(shoppingArchivePending === date) shoppingArchivePending = null;
  render();
}

// Full-object save — used by Item Setup, Product Mixes, Settings, Users, Sales upload, Stock Take,
// and Restore. Sends the WHOLE DATA object; the backend replaces the corresponding sheet(s) from it.
// Fine when one person edits at a time, which is why it carries the version check (see Code.gs's
// handleFullSave_): if someone else saved since this tab loaded, the save is refused rather than
// silently overwriting their change. Quick Buy / Shopping List purchase logging does NOT go through
// this — see persistPurchaseAction below for why.
//
// changedKeys: which top-level DATA fields this particular save actually touched (e.g. ["stockTakes"],
// ["procurementPlan","shoppingList"]) — the backend only rewrites THOSE sheets instead of all of them,
// which is most of what makes saving fast (each sheet rewrite is its own round trip on Google's side;
// skipping the ones nothing changed in is a bigger win than anything about the data size itself).
// Omit it (or pass nothing) for a genuine full save — currently just Restore from backup — where every
// sheet really does need rewriting.
async function persist(successMsg, changedKeys){
  setSyncBusy(true);
  try{
    const payload = changedKeys ? Object.assign({}, DATA, {changedKeys}) : DATA;
    // Content-Type: text/plain keeps this a CORS "simple request" — Apps Script Web Apps don't
    // handle the OPTIONS preflight a real "application/json" content-type would trigger. The
    // backend parses the body as JSON regardless of the header (see Code.gs's doPost).
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
    });
    let result = null;
    try{ result = await res.json(); }catch(e){ /* fall through to the failure toast below */ }
    if(res.ok && result && result.ok){
      saveConflict = null;
      if(result.syncVersion) DATA.syncVersion = result.syncVersion; // so this tab's NEXT save compares against its own last write, not the stale one it loaded with
      // this tab's OWN save is also, trivially, the data changing — absorb it here so the next staleness
      // poll doesn't turn around and tell this same tab "newer data is available" about its own write
      if(result.dataVersion){ DATA.dataVersion = result.dataVersion; lastKnownDataVersion = result.dataVersion; }
      toast(successMsg || "Saved");
    } else if(result && result.conflict){
      saveConflict = result.error || "This data changed elsewhere since you loaded it — reload before saving again.";
      toast("Not saved — someone else's changes would be overwritten");
    } else {
      toast("Could not save" + (result && result.error ? (": " + result.error) : "") + " — check your connection and try again");
    }
  }catch(e){
    toast("Could not save — check your connection and try again");
  }
  setSyncBusy(false);
  render();
}

// Purchase logging (Quick Buy, and Shopping List's inline "mark as bought"/delete) — sends just the
// one row being added/changed/removed. The backend touches only that row (see Code.gs's
// handlePurchaseAction_), so two people logging purchases around the same time — e.g. two buyers at
// the market — never overwrite each other and never need to reload. No version check applies here;
// there's nothing for it to conflict with.
async function persistPurchaseAction(payload, successMsg){
  setSyncBusy(true);
  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
    });
    let result = null;
    try{ result = await res.json(); }catch(e){ /* fall through to the failure toast below */ }
    if(res.ok && result && result.ok){
      // same reasoning as persist() above — this tab's own purchase log is data changing too, so absorb
      // its new version rather than have the next poll flag this tab's own write back at itself
      if(result.dataVersion){ DATA.dataVersion = result.dataVersion; lastKnownDataVersion = result.dataVersion; }
      toast(successMsg || "Saved");
    } else {
      toast("Could not save" + (result && result.error ? (": " + result.error) : "") + " — check your connection and try again");
    }
  }catch(e){
    toast("Could not save — check your connection and try again");
  }
  setSyncBusy(false);
  render();
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2600);
}

function wireLoginEvents(){
  const nameEl = document.getElementById("loginName");
  if(nameEl) nameEl.addEventListener("input", (e)=>{ loginNameInput = e.target.value; });
  const doLogin = async ()=>{
    if(loginBusy) return;
    const name = (document.getElementById("loginName")||{}).value || "";
    const pin = (document.getElementById("loginPin")||{}).value || "";
    loginNameInput = name;
    const trimmedName = name.trim();
    if(!trimmedName){ loginError = "Enter your name"; render(); return; }
    // A cheap version check first (the same single-Properties-read endpoint checkForUpdates() polls) —
    // this tab may have been sitting on the login screen a good while (a shared kitchen device left open
    // overnight, say) with nobody logged in to trigger the usual background poll. Refetches full data
    // only when something's actually changed, so logging in right after opening the app — the common
    // case, already current — stays effectively instant.
    loginBusy = true; loginError = ""; render();
    try{
      const res = await fetch(API_URL + "?action=version", {cache:"no-store"});
      const result = res.ok ? await res.json() : null;
      const serverVersion = (result && result.ok) ? (result.dataVersion || null) : undefined;
      if(serverVersion !== undefined && serverVersion !== (DATA.dataVersion || null)){
        DATA = await loadData();
        lastKnownDataVersion = DATA.dataVersion || null;
      }
    }catch(e){ /* offline / a blip — fall back to whatever's already loaded rather than blocking login */ }
    loginBusy = false;
    const u = (DATA.users||[]).find(x=> String(x.name).toLowerCase() === trimmedName.toLowerCase());
    if(!u){ loginError = "Name not recognized"; render(); return; }
    if(String(u.pin) !== String(pin)){ loginError = "Incorrect PIN"; render(); return; }
    currentUser = {name:u.name, role:u.role};
    try{ sessionStorage.setItem("dailyFruitUser", JSON.stringify(currentUser)); }catch(e){}
    // Land on the Dashboard every time Owner/Procurement logs in, regardless of whatever tab this
    // browser had open last time — that's the whole point of it being the landing page. Stock Taker and
    // Receiving don't have a "home" tab at all (see ROLE_TABS), so they're left on whatever they had
    // open before, same as always.
    if(roleCanAccessTab(u.role, "home")) setCurrentTab("home");
    loginNameInput = "";
    loginError = "";
    render();
  };
  const submitBtn = document.getElementById("loginSubmit");
  if(submitBtn) submitBtn.addEventListener("click", doLogin);
  const pinEl = document.getElementById("loginPin");
  if(pinEl) pinEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
  if(nameEl) nameEl.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doLogin(); });
}

function render(){
  // Computed up-front (not just inside the logged-in branch below) so the sync-overlay offset toggle
  // near the end of this function can always run, whichever branch actually executes.
  const kiosk = !!currentUser && currentUser.role === "receiving";
  const syncOverlayEl = document.getElementById("syncOverlay");
  // The kiosk top bar's own right-hand content (name + Logout) sits in the same top-right corner the
  // floating sync pill normally uses — nudge the pill down below the bar just for that one role so the
  // two never visually collide (see .sync-overlay.kiosk-offset).
  if(syncOverlayEl) syncOverlayEl.classList.toggle("kiosk-offset", kiosk);

  // preserve focus + cursor position across the full innerHTML rebuild below, so typing into a
  // live-filtered search box (Item Setup search, Quick Buy search) doesn't drop focus after each keystroke
  const activeEl = document.activeElement;
  const activeId = (activeEl && activeEl.id) ? activeEl.id : null;
  const hasSelectionApi = activeId && typeof activeEl.selectionStart === "number";
  const selStart = hasSelectionApi ? activeEl.selectionStart : null;
  const selEnd = hasSelectionApi ? activeEl.selectionEnd : null;

  // preserve scroll position too, for the same reason — every click that changes anything (e.g.
  // "Log order" on one row of a long Shopping List) re-renders the whole page, which would otherwise
  // reset a scrolled-down table straight back to the top every single time. .tablewrap is the
  // independently-scrolling region used by every long table (Shopping List, Dashboard, Receiving,
  // Purchase Costs' per-date groups, ...); matched back up by position after the rebuild, since the
  // elements themselves are destroyed and recreated, not moved. The outer page scroll is preserved too,
  // in case the page itself is taller than the viewport.
  const pageScrollY = window.scrollY;
  const wrapScrollTops = Array.from(document.querySelectorAll(".tablewrap")).map(el=> el.scrollTop);

  const sidebar = document.querySelector(".sidebar");
  if(!dataLoaded){
    if(sidebar) sidebar.style.display = "none";
    renderNav();
    const main = document.getElementById("main");
    main.innerHTML = dataLoadError ? renderLoadError(dataLoadError) : renderLoading();
    const retryBtn = document.getElementById("retryLoadBtn");
    if(retryBtn) retryBtn.addEventListener("click", ()=>{ dataLoadError = null; render(); boot(); });
    return;
  }
  if(!currentUser){
    if(sidebar) sidebar.style.display = "none";
    renderNav();
    const main = document.getElementById("main");
    main.innerHTML = renderLogin();
    wireLoginEvents();
  } else {
    // Receiving is scoped to exactly one tab (see ROLE_TABS) and is usually a shared tablet parked at
    // the dock — nothing for that role to navigate to, so the sidebar (and the space it takes up) is
    // hidden entirely for a genuinely full-screen page. Shane's ask. Logout, which normally lives in the
    // sidebar footer, moves into the kiosk top bar below since the sidebar is gone. (`kiosk` itself is
    // computed once, up top of render() — reused here rather than redeclared.)
    if(sidebar) sidebar.style.display = kiosk ? "none" : "";
    if(!roleCanAccessTab(currentUser.role, currentTab)){
      const firstAllowed = TABS.find(t=> roleCanAccessTab(currentUser.role, t.id));
      if(firstAllowed) setCurrentTab(firstAllowed.id);
    }
    renderNav();
    const main = document.getElementById("main");
    let pageHtml = "";
    if(currentTab==="home") pageHtml = renderHomeDashboard();
    else if(currentTab==="shoppinglist") pageHtml = renderShoppingList();
    else if(currentTab==="quickbuy") pageHtml = renderQuickBuy();
    else if(currentTab==="shoppingarchive") pageHtml = renderShoppingArchive();
    else if(currentTab==="receiving") pageHtml = renderReceiving();
    else if(currentTab==="dashboard") pageHtml = renderDashboard();
    else if(currentTab==="itemsetup") pageHtml = renderItemSetup();
    else if(currentTab==="recipes") pageHtml = renderRecipes();
    else if(currentTab==="salesdata") pageHtml = renderSalesData();
    else if(currentTab==="purchase") pageHtml = renderPurchase();
    else if(currentTab==="pricehistory") pageHtml = renderPriceHistory();
    else if(currentTab==="sageimport") pageHtml = renderSageImport();
    else if(currentTab==="stocktake") pageHtml = renderStockTake();
    else if(currentTab==="users") pageHtml = renderUsers();
    else if(currentTab==="stockvariance") pageHtml = renderStockVariance();
    else if(currentTab==="backup") pageHtml = renderBackup();
    // shown above whichever page is current, on every tab, until reloaded — a bulk save (Item Setup /
    // Product Mixes / Settings / Users) can be refused from any of those pages, and this needs to stay
    // visible regardless of which one the user wanders to afterward. saveConflict (an actually-rejected
    // save) takes priority over staleDataAvailable (just a heads-up, nothing lost yet) when somehow both
    // are true at once.
    main.innerHTML = (kiosk ? renderKioskTopBar() : "") + (saveConflict ? renderSaveConflictBanner(saveConflict) : (staleDataAvailable ? renderStaleDataBanner() : "")) + pageHtml;
    wireTabEvents();
    const reloadBtn = document.getElementById("saveConflictReload");
    if(reloadBtn) reloadBtn.addEventListener("click", ()=> location.reload());
    const staleReloadBtn = document.getElementById("staleDataReload");
    if(staleReloadBtn) staleReloadBtn.addEventListener("click", ()=> location.reload());
    if(kiosk){
      const kioskLogoutBtn = document.getElementById("kioskLogoutBtn");
      if(kioskLogoutBtn) kioskLogoutBtn.addEventListener("click", ()=>{
        currentUser = null;
        try{ sessionStorage.removeItem("dailyFruitUser"); }catch(e){}
        render();
      });
    }
  }

  if(activeId){
    const restored = document.getElementById(activeId);
    if(restored){
      restored.focus();
      if(selStart!==null && typeof restored.setSelectionRange==="function"){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  // restore scroll position captured at the top, now that the new DOM exists — matched by position,
  // since a page's .tablewrap elements appear in the same order every render even though the elements
  // themselves are brand new each time. Harmless no-op on a page with no .tablewrap (login, loading).
  document.querySelectorAll(".tablewrap").forEach((el,i)=>{
    if(wrapScrollTops[i]!==undefined) el.scrollTop = wrapScrollTops[i];
  });
  if(pageScrollY) window.scrollTo(0, pageScrollY);
}

// ---------- shared bits ----------
function distinctBaseProducts(){
  const set = new Set();
  for(const it of DATA.itemSetup) if(it.baseProduct) set.add(it.baseProduct);
  return Array.from(set).sort();
}
function categoryFor(baseProduct){
  if(!baseProduct) return "";
  return DATA.baseProductCategories[baseProduct] || "";
}
// Category is normally shared by every variant of a Base Product (see categoryFor above). A Product
// Mix has no Base Product of its own, so it can't hang its category off that shared lookup — instead
// it keeps its own category directly on the Item Setup row (it.category), set the moment "Mixes" (or
// any other category) is typed into a row that has no Base Product.
function effectiveCategoryFor(it){
  return it.baseProduct ? categoryFor(it.baseProduct) : (it.category || "");
}
function distinctCategories(){
  const set = new Set();
  Object.values(DATA.baseProductCategories).forEach(c=> c && set.add(c));
  DATA.itemSetup.forEach(it=>{ if(!it.baseProduct && it.category) set.add(it.category); });
  set.add("Mixes"); // always offered as a ready-made option for a Product Mix item, even before one's been used
  return Array.from(set).sort();
}

// Every category that exists, whether it's ever had its own DATA.categories entry or not (a lot of
// categories are still just whatever text someone typed into an item, with no entry of their own —
// this merges both worlds into one list so the Manage Categories card can show and edit all of them).
function allCategoriesWithMeta(){
  const names = new Set(distinctCategories());
  (DATA.categories||[]).forEach(c=> c.name && names.add(c.name));
  return Array.from(names).sort().map(name=>{
    const rec = (DATA.categories||[]).find(c=>c.name===name);
    return {name, hidden: !!(rec && rec.hidden)};
  });
}

// Categories marked hidden from Shopping List / Quick Buy — used to fully exclude their products from
// those two screens (both the row list and the category filter dropdown), everywhere else unaffected.
function hiddenCategorySet(){
  return new Set((DATA.categories||[]).filter(c=>c.hidden).map(c=>c.name));
}

// Add / rename / delete / hide a category. Lives on Item Setup (see renderItemSetup) — that's where
// categories actually get assigned to items, so managing the list itself belongs right alongside it,
// rather than on Calculated Holdings where it used to sit. Each action saves itself immediately (like
// the delete-item button on this same tab) rather than waiting for "Save changes", since a rename or
// delete here also touches Item Setup and Base Product categories, not just this card.
function renderManageCategories(){
  const cats = allCategoriesWithMeta();
  const rows = cats.map(c=>{
    const isBuiltIn = c.name==="Mixes"; // always offered as a ready-made category for Product Mix items — kept out of rename/delete so it can't drift from what the rest of the app expects
    return `
    <tr>
      <td>${isBuiltIn ? esc(c.name) : `<input class="rowinput" data-catname-input="${esc(c.name)}" value="${esc(c.name)}">`}</td>
      <td style="text-align:center;"><input type="checkbox" data-cathidden-input="${esc(c.name)}" ${c.hidden?"checked":""}></td>
      <td>${isBuiltIn ? `<span class="helptext">built-in</span>` : `<button class="delbtn" data-catdelete="${esc(c.name)}" title="Delete category">✕</button>`}</td>
    </tr>`;
  }).join("");
