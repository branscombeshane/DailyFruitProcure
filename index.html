function chip(text, kind){ return `<span class="chip ${kind}">${esc(text)}</span>`; }
// A price/cost <input type="number"> with a visible "R" (Rand) prefix — Shane's ask for Receiving: these
// read as money, not bare numbers. The prefix is purely visual (a real "R120" isn't valid input for
// type="number"), so the field's own value stays a plain number underneath, unchanged for the code that
// reads it (.value is still just "120"). `attrs` is any extra raw HTML attributes (id, data-*, title, ...).
function randFieldHtml(cls, value, placeholder, attrs, wrapperStyle){
  // wrapperStyle sizes the whole R-prefixed control (e.g. a fixed width to match a table column) — the
  // input itself always fills it (100%), same as the width:100% every other type=number input gets.
  return `<span class="rand-field"${wrapperStyle?` style="${wrapperStyle}"`:""}><span class="rand-prefix">R</span><input type="number" step="0.01"${cls?` class="${esc(cls)}"`:""} placeholder="${esc(placeholder||"0.00")}" value="${esc(value===undefined||value===null?"":value)}" ${attrs||""}></span>`;
}
function statusChip(status){
  if(status==="OK") return chip("OK","good");
  if(!status) return "";
  return chip(status,"critical");
}
// Display wording differs from the internal status string for "Buy": the sheet/status-code value
// stays "Buy" everywhere in logic (filters, counts, comparisons) so nothing else has to change, but
// everywhere it's shown to a person it reads "Consider Buying" — a 75%-of-target item that'll comfortably
// last until tomorrow's delivery shouldn't read as an urgent imperative.
function shoppingStatusLabel(status){
  return status==="Buy" ? "Consider Buying" : status;
}
function shoppingStatusChip(status){
  const kind = {"Critical":"critical","Buy":"warn","OK":"good","Overstocked":"neutral","No stock take":"neutral","Missing setup":"neutral"}[status] || "neutral";
  return chip(shoppingStatusLabel(status), kind);
}

// Shared label + chip for one purchase line, used everywhere a purchase shows up (Shopping List's buy
// cell, Quick Buy, Shopping List Archive). Pending (not yet received — see isReceived) shows what was
// ORDERED, styled to look clearly outstanding rather than done, with "cost pending" when the price
// genuinely isn't known yet (e.g. herbs invoiced later); received shows the ACTUAL received figures,
// styled as complete. opts.showWho (Archive only — the day-to-day views are busy enough already, and
// "who" is right there in Purchase Costs/Receiving for them) appends who logged the order and, once
// received, who confirmed it — Shane's ask, so a past day's record shows both without another tab.
function purchaseLineChip(e, opts){
  opts = opts || {};
  if(isNotReceived(e)) return chip("✕ Not received" + (e.notReceivedReason ? ": " + e.notReceivedReason : ""), "critical");
  const received = isReceived(e);
  const qty = received ? e.receivedQty : e.qty;
  const cost = received ? e.receivedCost : e.cost;
  const hasQty = qty!==undefined && qty!==null && qty!=="";
  const hasCost = cost!==undefined && cost!==null && cost!=="";
  let core = (hasQty ? fmtNum(qty)+" @ " : "") + (hasCost ? money(cost) : "cost pending") + (e.supplier ? " (" + esc(e.supplier) + ")" : "");
  if(opts.showWho){
    if(e.loggedBy) core += " — logged by " + esc(e.loggedBy);
    if(received && e.receivedBy) core += ", received by " + esc(e.receivedBy);
  }
  return received ? chip("✓ " + core, "good") : chip("📦 Ordered: " + core, "warn");
}
function csvParseLine(line){
  const out=[]; let cur=""; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQ = !inQ; continue; }
    if(ch===',' && !inQ){ out.push(cur); cur=""; continue; }
    cur+=ch;
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function toCsvField(v){
  v = (v===null||v===undefined) ? "" : String(v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
// Sage "Sales By Item Report" exports can carry a header row and/or a trailing
// "Grand Total" (or similar) summary row alongside the real item rows.
const SALES_CSV_NON_ITEM_LABELS = new Set(["item","items","total","totals","grand total","sub total","subtotal","sub-total"]);
function parseSalesCsvText(text){
  // one row per item: Item, Qty Sold, Total Cost, Total Selling.
  // tolerates an optional header row and a trailing totals row (both skipped
  // automatically, wherever they fall in the file) and blank lines.
  const rows = [];
  const lines = text.split(/\r?\n/);
  lines.forEach((line, idx)=>{
    if(!line.trim()) return;
    const parts = csvParseLine(line);
    if(parts.length < 4) return;
    const itemLabel = (parts[0]||"").trim();
    if(!itemLabel) return;
    if(SALES_CSV_NON_ITEM_LABELS.has(itemLabel.toLowerCase())) return; // header or totals row, not a real item
    if(idx===0){
      const qtyCell = (parts[1]||"").trim();
      if(qtyCell && isNaN(Number(qtyCell))) return; // fallback: header row with a non-numeric qty column
    }
    rows.push({item:itemLabel, qty:Number(parts[1])||0, cost:Number(parts[2])||0, selling:Number(parts[3])||0});
  });
  return rows;
}

// ---------- Shopping List ----------
// A logged "purchase issue" for a product today is either a genuine supply problem — "Unable to
// purchase", with a free-text reason, shown as a critical/red chip — or a deliberate decision not to
// buy today because there's already enough stock on hand to comfortably last until tomorrow's
// delivery. Both live in the same DATA.purchaseIssues table (see unableEntryForDate) and are told
// apart purely by this canned reason string, so no separate "type" column/backend change is needed —
// a real "unable" reason typed by hand is never going to happen to match it exactly.
const SUFFICIENT_STOCK_REASON = "Have enough stock till tomorrow";
// opts.showWho (Archive only, same convention as purchaseLineChip above) appends who logged the
// "have enough stock" call or the "unable to purchase" reason — Shane spotted the Archive showing this
// chip with no attribution at all, unlike a real purchase line right next to it.
function issueChipHtml(issue, opts){
  if(!issue) return "";
  opts = opts || {};
  const who = (opts.showWho && issue.loggedBy) ? " — logged by " + esc(issue.loggedBy) : "";
  if(issue.reason === SUFFICIENT_STOCK_REASON) return chip("✓ " + SUFFICIENT_STOCK_REASON + who, "good");
  return chip("✕ Unable: " + issue.reason + who, "critical");
}
// Renders every purchase LINE logged today for this base product as its own chip (buying the same
// product from two suppliers on the same day is normal now, not a duplicate) — each showing "Ordered"
// (amber) until the Receiving role confirms it arrived, then "✓" (green) with the actual received
// figures, see purchaseLineChip — plus, mirroring Quick Buy, the "unable to purchase" reason for today,
// if one's been logged. For roles that can manage purchases this includes Edit/Delete per line, an "Add
// another" control, and a "Mark unable to buy" control. shoppingBuyEditing maps baseProduct -> the id of
// the purchase line currently being edited (or "new" when adding a fresh one); shoppingIssueEditing is
// the set of baseProducts currently showing the inline "unable to purchase" reason input.
function renderBuyCell(r, today){
  const bp = r.baseProduct;
  const entries = purchaseEntriesForDate(bp, today);
  const issue = unableEntryForDate(bp, today);
  const issueChip = issue ? `<span style="display:inline-flex;align-items:center;gap:4px;">
      ${issueChipHtml(issue)}
      ${canManagePurchases() ? `<button class="btn" data-issue-edit="${esc(bp)}" style="padding:1px 6px;font-size:11px;">Edit</button>
      <button class="delbtn" data-issue-delete="${esc(bp)}" title="Delete this entry">✕</button>` : ""}
    </span>` : "";

  if(!canManagePurchases()){
    // defensive fallback for a non-managing role — only Owner/Procurement can actually reach the
    // Shopping List tab at all now (see ROLE_TABS), so this normally never renders: show what's
    // ordered/received (or why it wasn't), no way to log/edit here.
    const parts = entries.map(e=> purchaseLineChip(e));
    if(issue) parts.push(issueChipHtml(issue));
    if(!parts.length) return `<span class="helptext">—</span>`;
    return parts.join(" ");
  }

  const editingVal = shoppingBuyEditing.get(bp); // undefined = no form open; "new" = adding a line; else = id of the line being edited
  const editingExisting = (editingVal && editingVal!=="new") ? entries.find(e=>e.id===editingVal) : null;
  const issueEditing = shoppingIssueEditing.has(bp);

  const lineChips = entries.map(e=> `
    <span style="display:inline-flex;align-items:center;gap:4px;">
      ${purchaseLineChip(e)}
      <button class="btn" data-buy-edit="${esc(bp)}" data-buy-edit-id="${esc(e.id||"")}" style="padding:1px 6px;font-size:11px;">Edit</button>
      <button class="delbtn" data-buy-delete-id="${esc(e.id||"")}" data-buy-delete-bp="${esc(bp)}" title="Delete this entry">✕</button>
    </span>`).join("");

  if(issueEditing){
    return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      ${lineChips ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${lineChips}</div>` : ""}
      <div class="buyrow" data-issue-row="${esc(bp)}" style="display:flex;align-items:center;gap:4px;white-space:nowrap;">
        <input type="text" class="issue-reason" placeholder="Reason" value="${esc(issue?issue.reason:"")}" style="width:150px;">
        <button class="btn primary" data-issue-tick="${esc(bp)}" title="Save" style="padding:2px 10px;font-size:12px;background:var(--critical);border-color:var(--critical);">✕</button>
        <button class="btn" data-issue-cancel="${esc(bp)}" style="padding:2px 6px;font-size:12px;" title="Close without saving">✕</button>
      </div>
    </div>`;
  }

  if(!editingVal){
    return `<div data-buy-row="${esc(bp)}" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      ${lineChips}
      ${issueChip}
      <button class="btn" data-buy-addnew="${esc(bp)}" style="padding:2px 10px;font-size:12px;white-space:nowrap;">+ ${entries.length?"Add another":"Log order"}</button>
      ${!issue ? `<button class="btn" data-issue-addnew="${esc(bp)}" style="padding:2px 10px;font-size:12px;white-space:nowrap;">+ Unable to buy</button>
      <button class="btn" data-sufficient-addnew="${esc(bp)}" style="padding:2px 10px;font-size:12px;white-space:nowrap;">+ Have enough stock</button>` : ""}
    </div>`;
  }

  // Qty is left blank for a fresh line — Shane's call: prefilling it with the suggested/required amount
  // meant it was easy to tick through without actually checking what's being ordered. Editing an
  // existing line still shows what was actually entered, so a correction isn't retyped from scratch.
  const prefillQty = editingExisting && editingExisting.qty!==undefined && editingExisting.qty!==null ? editingExisting.qty : "";
  const prefillCost = editingExisting && editingExisting.cost!==undefined && editingExisting.cost!==null ? editingExisting.cost : "";
  const prefillSupplier = editingExisting ? (editingExisting.supplier||"") : "";
  return `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
    ${lineChips ? `<div style="display:flex;gap:6px;flex-wrap:wrap;">${lineChips}</div>` : ""}
    <div class="buyrow" data-buy-row="${esc(bp)}" data-buy-editid="${esc(editingExisting?editingVal:"")}" style="display:flex;align-items:center;gap:4px;white-space:nowrap;">
      <input type="number" step="0.01" class="buy-qty" placeholder="Qty*" value="${esc(prefillQty)}" style="width:56px;">
      <input type="number" step="0.01" class="buy-cost" placeholder="Price/u (if known)" value="${esc(prefillCost)}" style="width:110px;">

    </div>
    <div class="helptext">*Qty is what you're ordering. Leave price blank if it isn't known yet (e.g. invoiced later) — it'll show as "Ordered" until Receiving confirms delivery.</div>
  </div>`;
}

      </div>
      <div class="helptext" style="margin-top:8px;">This logs it as ordered — it'll show as "Ordered" until someone in Receiving confirms it's arrived.</div>
      <button class="btn primary" id="quickBuyConfirm" style="width:100%;font-size:16px;padding:15px;margin-top:14px;">${editingLine ? "✓ Save changes" : "✓ Confirm order"}</button>`;

    const unableForm = `
      <div class="field">
        <label>Reason</label>
        <input type="text" id="quickBuyReason" value="${esc(prefillReason)}" placeholder="e.g. out of season, quality not up to standard" style="font-size:16px;padding:13px;">
      </div>
      <button class="btn primary" id="quickBuyLogUnable" style="width:100%;font-size:16px;padding:15px;margin-top:14px;background:var(--critical);border-color:var(--critical);">✕ Log as unable to purchase</button>`;

    const sufficientForm = `
      <div class="helptext" style="margin-bottom:14px;">Logs today as skipped for this product — you already have enough on hand to comfortably last until tomorrow's delivery. It won't show as needing action on the Dashboard or Shopping List today.</div>
      <button class="btn primary" id="quickBuyLogSufficient" style="width:100%;font-size:16px;padding:15px;background:var(--good);border-color:var(--good);">✓ Log — enough stock till tomorrow</button>`;

    bodyHtml = `
      <div class="card">
        <div class="cardbody">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px;">
            <div>
              <div style="font-size:21px;font-weight:700;line-height:1.3;">${esc(row.baseProduct)}</div>
              <div class="helptext" style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                ${esc(row.procUnit||"")}
                ${row.status ? shoppingStatusChip(row.status) : ""}
                ${stockLine ? `<span>${esc(stockLine)}</span>` : ""}
                ${row.toBuy!==null && row.toBuy!==undefined ? `<span>suggested buy: ${fmtNum(row.toBuy,0)}</span>` : ""}
              </div>
            </div>
            <button class="btn" id="quickBuyBack">← Back</button>
          </div>
          ${quickBuyMode==='buy' ? todaysLinesList : ""}
          ${modeToggle}
          ${quickBuyMode==='unable' ? unableForm : quickBuyMode==='sufficient' ? sufficientForm : buyForm}
        </div>
      </div>`;
  } else {
    // once a product's been bought (or logged as unable to purchase) today, sink it out of the
    // urgency-ordered pick list so the top of the list always reflects what's still outstanding —
    // but keep it visible (dimmed, with what was logged) rather than hiding it, so nothing gets
    // double-bought or forgotten about.
    const loggedTodaySet = new Set([...todaysEntries.map(p=>p.baseProduct), ...todaysIssues.map(p=>p.baseProduct)]);
    const pending = candidates.filter(r=> !loggedTodaySet.has(r.baseProduct));
    const done = candidates.filter(r=> loggedTodaySet.has(r.baseProduct));

    const doneBadge = (r)=>{
      const lines = purchaseEntriesForDate(r.baseProduct, today);
      if(lines.length===1) return purchaseLineChip(lines[0]);
      if(lines.length>1){
        const allReceived = lines.every(isReceived);
        return chip((allReceived?"✓ ":"📦 ") + lines.length + " order(s) logged", allReceived?"good":"warn");
      }
      const issue = unableEntryForDate(r.baseProduct, today);
      if(issue) return issueChipHtml(issue);
      return "";
    };

    const pendingButtons = pending.slice(0,60).map(r=>`
      <button class="quickbuyitem" data-quickbuy-pick="${esc(r.baseProduct)}">
        <span class="qb-name">${esc(r.baseProduct)}</span>
        <span class="qb-meta">
          ${stockPctBadge(r)}
          ${r.status ? shoppingStatusChip(r.status) : ""}
        </span>
      </button>`).join("");

    const doneButtons = done.map(r=>`
      <button class="quickbuyitem" data-quickbuy-pick="${esc(r.baseProduct)}" style="opacity:0.55;">
        <span class="qb-name">${esc(r.baseProduct)}</span>
        <span class="qb-meta">${doneBadge(r)}</span>
      </button>`).join("");

    bodyHtml = `
      <div class="card">
        <div class="cardbody">
          <div class="formgrid" style="margin-bottom:12px;">
            <div class="field"><label>Category</label><select id="quickBuyCategoryFilterSel">${categoryOptions}</select></div>
          </div>
          <input type="text" id="quickBuySearchInput" placeholder="Search a product…" value="${esc(quickBuySearch)}" style="font-size:16px;padding:13px;margin-bottom:12px;">
          <div class="quickbuylist">${pendingButtons || (done.length ? `<div class="empty">Everything in this filter is logged for today ✓</div>` : `<div class="empty">No products match this filter.</div>`)}</div>
          ${pending.length>60 ? `<div class="helptext" style="margin-top:10px;">${pending.length-60} more still to buy — keep typing to narrow it down.</div>` : ""}
          ${done.length ? `
            <div class="helptext" style="margin:16px 0 8px;font-weight:600;">Already logged today (${done.length})</div>
            <div class="quickbuylist">${doneButtons}</div>
          ` : ""}
        </div>
      </div>`;
  }

  // One row PER PURCHASE LINE (not per base product) — buying the same product from two suppliers
  // today means two rows here, each independently editable/deletable by its own id.
  const loggedRows = [
    ...todaysEntries.map(p=>({type:"purchase", baseProduct:p.baseProduct, entry:p})),
    ...todaysIssues.map(p=>({type:"issue", baseProduct:p.baseProduct, entry:p})),
  ].sort((a,b)=> a.baseProduct.localeCompare(b.baseProduct) || (a.entry.supplier||"").localeCompare(b.entry.supplier||""));

  const loggedHtml = loggedRows.length ? loggedRows.map(({type,baseProduct,entry})=>{
    if(type==="purchase"){
      return `
      <div class="quickbuylogrow">
        <span>${esc(baseProduct)}${entry.supplier ? ` <span class="helptext">(${esc(entry.supplier)})</span>` : ""} ${entry.loggedBy ? `<span class="helptext">— logged by ${esc(entry.loggedBy)}</span>` : ""}</span>
        <span style="display:flex;align-items:center;gap:10px;">
          ${purchaseLineChip(entry)}
          <button class="btn small" data-quickbuy-edit-purchase="${esc(baseProduct)}" data-quickbuy-edit-id="${esc(entry.id||"")}">Edit</button>
          <button class="delbtn" data-quickbuy-delete-id="${esc(entry.id||"")}" title="Delete this entry">✕</button>
        </span>
      </div>`;
    }
    return `
    <div class="quickbuylogrow">
      <span>${esc(baseProduct)} ${entry.loggedBy ? `<span class="helptext">— logged by ${esc(entry.loggedBy)}</span>` : ""}</span>
      <span style="display:flex;align-items:center;gap:10px;">
        ${issueChipHtml(entry)}
        <button class="btn small" data-quickbuy-edit-issue="${esc(baseProduct)}">Edit</button>
        <button class="delbtn" data-quickbuy-delete-issue="${esc(baseProduct)}" title="Delete this entry">✕</button>
      </span>
    </div>`;
  }).join("") : `<div class="empty">Nothing logged yet today.</div>`;

  const todaysUnableCount = todaysIssues.filter(p=> p.reason!==SUFFICIENT_STOCK_REASON).length;
  const todaysSufficientCount = todaysIssues.length - todaysUnableCount;

  return `
    <div class="pagehead">
      <div><h2>Quick Buy</h2><p>Fast order entry for the market — search a product, enter what you're ordering (or why you couldn't), confirm. Saves straight to Purchase Costs as an order, awaiting confirmation on the Receiving tab once it arrives.</p></div>
    </div>
    ${bodyHtml}
    <div class="card">
      <div class="cardhead"><h3>Logged today</h3><div class="desc">${esc(today)} — ${todaysEntries.length} ${todaysEntries.length===1?"order":"orders"}, ${todaysUnableCount} unable to purchase, ${todaysSufficientCount} enough stock till tomorrow</div></div>
      <div class="cardbody">${loggedHtml}</div>
    </div>`;
}

// ---------- Shopping List Archive ----------
// A day-by-day historical record: each row is exactly what the live Shopping List said at snapshot
// time (see Code.gs's snapshotShoppingListToday, which runs once a day via a time-based trigger), not
// a live recalculation — so it stays accurate even after settings (safety buffers, cycle lengths) are
// changed later. Purchases/"unable to purchase" for that date are read live from DATA.purchaseCosts/
// purchaseIssues — those are already dated and permanent, no separate archiving needed for them.
function renderShoppingArchive(){
  const dates = DATA.shoppingListSnapshotDates || [];
  const dateOptions = dates.length
    ? `<option value="">Select a date…</option>` + dates.map(d=>`<option value="${esc(d)}" ${d===shoppingArchiveDate?"selected":""}>${esc(d)}</option>`).join("")
    : `<option value="">No snapshots yet</option>`;

  let bodyHtml;
  if(!dates.length){
    bodyHtml = `<div class="banner warn">No archived Shopping Lists yet. This fills in automatically once a day — see the "ONE-TIME SETUP" note above setupDailyShoppingListSnapshotTrigger in Code.gs if that hasn't been set up yet. The first entry appears the day after it's installed.</div>`;
  } else if(!shoppingArchiveDate){
    bodyHtml = `<div class="empty">Pick a date above to see that day's Shopping List.</div>`;
  } else if(shoppingArchiveError){
    bodyHtml = `<div class="banner warn">${esc(shoppingArchiveError)}</div>`;
  } else if(shoppingArchiveRows===null){
    bodyHtml = `<div class="empty">Loading…</div>`;
  } else {
    const hasNum = v=> v!==undefined && v!==null && v!=="";
    const search = shoppingArchiveSearch.trim().toLowerCase();
    const shownRows = search ? shoppingArchiveRows.filter(r=> (r.baseProduct||"").toLowerCase().includes(search)) : shoppingArchiveRows;
    const tableRows = shownRows.map(r=>{
      const purchases = purchaseEntriesForDate(r.baseProduct, shoppingArchiveDate);
      const issue = unableEntryForDate(r.baseProduct, shoppingArchiveDate);
      // showWho:true — unlike the live Shopping List/Quick Buy buy-cell, a past day's record here is
      // the point of the Archive, so who logged the order and who confirmed it goes right on the chip
      // instead of sending someone to Purchase Costs/Receiving to look it up.
      const parts = purchases.map(e=> purchaseLineChip(e, {showWho:true}));
      if(issue) parts.push(issueChipHtml(issue, {showWho:true}));
      return `
      <tr>
        <td>${esc(r.baseProduct)}</td>
        <td>${esc(r.category||"—")}</td>
        <td>${shoppingStatusChip(r.status)}</td>
        <td class="num">${hasNum(r.currentStock) ? fmtNum(r.currentStock) : "—"}</td>
        <td class="helptext">${esc(r.stockDate||"—")}</td>
        <td class="num">${hasNum(r.recommended) ? fmtNum(r.recommended,0) : "—"}</td>
        <td class="num">${hasNum(r.toBuy) ? fmtNum(r.toBuy,0) : "—"}</td>
        <td>${esc(r.procUnit||"—")}</td>
        <td>${parts.join(" ") || `<span class="helptext">—</span>`}</td>
      </tr>`;
    }).join("");
    bodyHtml = `
    <div class="card">
      <div class="cardhead"><div><h3>${esc(shoppingArchiveDate)}</h3><div class="desc">${search ? `${shownRows.length} of ${shoppingArchiveRows.length}` : shoppingArchiveRows.length} product(s) — exactly as the Shopping List stood that evening, not recalculated with today's settings.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;max-height:640px;overflow-y:auto;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Status</th><th class="num">Stock that day</th><th>Counted on</th><th class="num">Holding target</th><th class="num">Suggested buy</th><th>Unit</th><th>Purchases that day</th></tr></thead>
          <tbody>${tableRows || `<tr><td colspan="9" class="empty">${search ? `No products match "${esc(shoppingArchiveSearch)}".` : "No products recorded for this date."}</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
  }

  return `
    <div class="pagehead">
      <div><h2>Shopping List Archive</h2><p>A day-by-day record of the Shopping List, captured automatically once a day — exactly what it said at the time, including what was bought or marked unable to purchase, so you can look back at any past date.</p></div>
      <div class="actions">
        <div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="shoppingArchiveSearchInput" placeholder="Base product…" value="${esc(shoppingArchiveSearch)}"></div>
        <div class="field" style="min-width:200px;"><label>Date</label><select id="shoppingArchiveDateSel">${dateOptions}</select></div>
      </div>
    </div>
    ${bodyHtml}`;
}

// ---------- Receiving ----------
// The second half of the Order -> Received workflow: every purchase logged from Shopping List/Quick Buy
// starts here as an open order, and stays that way — however "done" it might look on Shopping List —
// until someone confirms it actually arrived. Solves the case that prompted this (herbs ordered from a
// farmer in the morning, delivered after Procurement has gone for the day, with no price until the
// invoice comes) but applies to every purchase, so nothing's numbers are ever treated as final without
// someone having actually laid eyes on the delivery. Owner, Receiving, Procurement and Stock Taker can
// all confirm (see canManageReceiving) — Market is the only role that can't even see this tab (ROLE_TABS).
const RECEIVING_RECENT_DAYS = 7;
// Spells out the actual ordered vs. received figures on a discrepancy flag, rather than a bare "qty
// differs" — the original ordered qty/cost is otherwise invisible once a line is received (it's
// deliberately hidden pre-receipt too, per Shane's blind-count request), so without this there's no way
// to check a flagged discrepancy is real without going to the underlying sheet. Shared by Receiving's
// own "Recently received" table and the Dashboard's discrepancy card, so both always agree.
function discrepancyChipHtml(p){
  const disc = receivingDiscrepancy(p);
  if(!disc) return "";
  return chip("⚠ " + [
    disc.qtyDiff ? `qty differs (ordered ${fmtNum(p.qty)}, received ${fmtNum(p.receivedQty)})` : null,
    disc.costDiff ? `cost differs (ordered ${money(p.cost)}, received ${money(p.receivedCost)})` : null,
  ].filter(Boolean).join(", "), "warn");
}

// A printable paper record of one confirmed delivery — Shane's ask, so there's something physical to
// keep with the stock or hand to whoever checks it in. Plain black-on-white, deliberately independent
// of the app's own light/dark theme (see the .print-slip-area CSS). Shows the ordered figures too, even
// though the on-screen count flow hides them on purpose (to stop a rubber-stamped count) — once the
// delivery is confirmed, seeing what was ordered next to what arrived is exactly the point of the slip.
function renderReceivingSlipHtml(p){
  const disc = receivingDiscrepancy(p);
  const hasOrderedQty = p.qty!==undefined && p.qty!==null && p.qty!=="";
  return `
    <div class="print-slip">
      <h2>Daily Fruit</h2>
      <div class="print-slip-sub">Goods Received Slip</div>
      <table>
        <tr><td>Base product</td><td>${esc(p.baseProduct)}</td></tr>
        <tr><td>Category</td><td>${esc(categoryFor(p.baseProduct)||"—")}</td></tr>
        <tr><td>Supplier</td><td>${esc(p.supplier||"—")}</td></tr>
        <tr><td>Ordered by</td><td>${esc(p.loggedBy||"—")}</td></tr>
        <tr><td>Order date</td><td>${esc(p.date||"—")}</td></tr>
        <tr><td>Ordered qty</td><td>${hasOrderedQty ? fmtNum(p.qty) : "—"}</td></tr>
        <tr><td>Received qty</td><td>${fmtNum(p.receivedQty)}</td></tr>
        <tr><td>Received by</td><td>${esc(p.receivedBy||"—")}</td></tr>
        <tr><td>Received on</td><td>${esc(p.receivedDate||"—")}${p.receivedTime ? " at " + esc(fmtTime(p.receivedTime)) : ""}</td></tr>
      </table>
      ${disc && disc.qtyDiff ? `<div class="print-slip-disc">⚠ Discrepancy — qty ordered ${fmtNum(p.qty)}, received ${fmtNum(p.receivedQty)}</div>` : ""}
      <div class="print-slip-foot">Printed ${esc(new Date().toLocaleString())}${currentUser ? " by " + esc(currentUser.name) : ""}</div>
    </div>`;
}
// Clickable summary tile for the four stats atop Receiving — clicking one narrows the page down to just
// that tile's card (clicking the already-active one clears back to showing all three cards), same
// toggle convention as Shopping List's status tiles (statBlock) and Price History's alert tiles
// (priceStatBlock). "discrepancy" additionally narrows Recently received to just the flagged rows,
// since a discrepancy isn't its own card — it's a slice of Recently received.
function receivingStatBlock(label, filterValue, currentFilter, count, color, small){
  const active = currentFilter === filterValue;
  return `<div class="stat clickable${active?" active":""}" data-receiving-tile-filter="${esc(filterValue)}" title="Show only ${esc(label)}${active?" (click again to clear)":""}">
    <div class="label">${esc(label)}</div><div class="value${small?" small":""}"${color?` style="color:${color}"`:""}>${count}</div>
  </div>`;
}
function renderReceiving(){
  const manage = canManageReceiving();
  // Marking a delivery "Not received" (and seeing the history of what's been marked that way) is an
  // Owner/Procurement call — Shane's ask: the Receiving role logs what physically arrives, full stop,
  // and doesn't get a say in resolving an order that never showed up. Owner/Procurement still see and
  // use it exactly as before. Stock Taker was given the rest of Receiving's functions (Shane's ask: same
  // as Receiving) so it's excluded here too — same restriction, for the same reason.
  const canMarkNotReceived = manage && currentUser.role !== "receiving" && currentUser.role !== "stocktaker";
  // Defends against a stale filter from a different role/session — e.g. Owner had "notreceived" toggled
  // on, then a Receiving-role user (who never sees that tile at all) picks up the same browser tab.
  const tileFilter = (receivingTileFilter === "notreceived" && !canMarkNotReceived) ? "" : receivingTileFilter;
  const showPendingCard = !tileFilter || tileFilter === "pending";
  const showRecentlyReceivedCard = !tileFilter || tileFilter === "received" || tileFilter === "discrepancy";
  const showNotReceivedCard = canMarkNotReceived && (!tileFilter || tileFilter === "notreceived");
  const discrepancyOnly = tileFilter === "discrepancy";
  const todayStr = new Date().toISOString().slice(0,10);
  const defaultCutoff = new Date(Date.now() - RECEIVING_RECENT_DAYS*86400000).toISOString().slice(0,10);

  // "Recently received" defaults to the last RECEIVING_RECENT_DAYS days (unchanged), but either end can
  // be overridden to look further back or at a specific window — e.g. checking what came in on one
  // particular delivery day. Picking just one end leaves the other at its default (from-only shows
  // everything since that date; to-only shows the default-length window ending on that date).
  const customRange = !!(receivingDateFrom || receivingDateTo);
  const dateFrom = receivingDateFrom || defaultCutoff;
  const dateTo = receivingDateTo || todayStr;

  const pending = DATA.purchaseCosts.filter(p=> p.baseProduct && !isReceived(p) && !isNotReceived(p))
    .slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"") || a.baseProduct.localeCompare(b.baseProduct));
  const recentlyReceived = DATA.purchaseCosts.filter(p=> p.baseProduct && isReceived(p) && p.receivedDate >= dateFrom && p.receivedDate <= dateTo)
    .slice().sort((a,b)=> (b.receivedDate||"").localeCompare(a.receivedDate||""));
  const notReceived = DATA.purchaseCosts.filter(p=> p.baseProduct && isNotReceived(p))
    .slice().sort((a,b)=> (b.notReceivedDate||"").localeCompare(a.notReceivedDate||""));
  const discrepancyCount = recentlyReceived.filter(p=> receivingDiscrepancy(p)).length;
  const rangeLabel = customRange ? `${dateFrom} to ${dateTo}` : `the last ${RECEIVING_RECENT_DAYS} days`;
  const rangeWindowWord = customRange ? "this range" : "this window";
  const rangeStatLabel = customRange ? `Received (${dateFrom} → ${dateTo})` : `Received (last ${RECEIVING_RECENT_DAYS}d)`;
  const rangeDiscStatLabel = customRange ? `Discrepancies (${dateFrom} → ${dateTo})` : `Discrepancies (last ${RECEIVING_RECENT_DAYS}d)`;

  // Search filters BOTH tables below by base product or supplier — the stat tiles above stay as
  // totals regardless (same convention as Shopping List's category/status filters vs. its stat tiles).
  const search = receivingSearch.trim().toLowerCase();
  const matchesReceivingSearch = (p)=> !search
    || (p.baseProduct||"").toLowerCase().includes(search)
    || (p.supplier||"").toLowerCase().includes(search);
  const pendingShown = pending.filter(matchesReceivingSearch);
  const recentlyReceivedShown = recentlyReceived.filter(matchesReceivingSearch).filter(p=> !discrepancyOnly || receivingDiscrepancy(p));
  const notReceivedShown = notReceived.filter(matchesReceivingSearch);

  const pendingRows = pendingShown.map(p=>{
    const hasCost = p.cost!==undefined && p.cost!==null && p.cost!=="";
    const overdue = p.date && p.date < todayStr;
    // Deliberately NOT showing the ordered quantity here (and not pre-filling receive-qty with it) —
    // Shane's call: whoever confirms receipt must physically count the stock and type what they counted,
    // rather than seeing the ordered figure and rubber-stamping it. That's how a shortage actually gets
    // caught instead of silently confirmed. The ordered qty (p.qty) is still stored and used for the
    // discrepancy check once received — it's just not displayed at count time.
    const costCell = hasCost ? "@ "+money(p.cost) : chip("cost pending","neutral");
    // "Not received" is the other resolution besides actually confirming receipt — supplier ran out,
    // order cancelled, wrong stock sent back, etc. Mirrors Shopping List's "Unable to buy" inline reason
    // box (shoppingIssueEditing) via receivingNotReceivedEditing, tracked per pending-line id.
    const notReceivedOpen = receivingNotReceivedEditing.has(p.id);
    // Amount and Price used to share one crowded "Confirm received" cell with the action buttons —
    // Shane's ask: give them their own headed columns instead, so it's clear which typed number is the
    // count and which is the cost. data-receive-row now lives on the <tr> itself (rather than a div
    // wrapping just these two inputs) since the amount/price inputs and the buttons that read them are
    // siblings across three different cells now, not all inside one — see data-receive-tick's click
    // handler, which finds both via `.closest("[data-receive-row]")` off whichever cell the click came from.
    const actionsCell = manage ? `
      <div class="buyrow" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
        <button class="btn primary" data-receive-tick="${esc(p.id||"")}" title="Confirm received" style="padding:2px 10px;font-size:12px;">✓ Received</button>
        ${(canMarkNotReceived && !notReceivedOpen) ? `<button class="btn" data-notreceived-addnew="${esc(p.id||"")}" style="padding:2px 10px;font-size:12px;">✕ Not received</button>` : ""}
      </div>
      ${(canMarkNotReceived && notReceivedOpen) ? `
      <div class="buyrow" data-notreceived-row="${esc(p.id||"")}" style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px;">
        <input type="text" class="notreceived-reason" placeholder="Reason (e.g. out of stock)" style="width:200px;">
        <button class="btn primary" data-notreceived-tick="${esc(p.id||"")}" title="Confirm not received" style="padding:2px 10px;font-size:12px;background:var(--critical);border-color:var(--critical);">✕ Confirm</button>
        <button class="btn" data-notreceived-cancel="${esc(p.id||"")}" style="padding:2px 6px;font-size:12px;">Cancel</button>
      </div>` : ""}` : `<span class="helptext">Awaiting confirmation</span>`;
    return manage ? `
    <tr data-receive-row="${esc(p.id||"")}">
      <td>${esc(p.baseProduct)}</td>
      <td>${esc(categoryFor(p.baseProduct)||"—")}</td>
      <td class="helptext">${esc(p.date||"—")}${overdue ? ` ${chip("overdue","warn")}` : ""}</td>
      <td>${costCell}</td>
      <td>${esc(p.supplier||"—")}</td>
      <td>${esc(p.loggedBy||"—")}</td>
      <td><input type="number" step="0.01" class="receive-qty" placeholder="Count qty" value="" style="width:80px;"></td>
      <td>${randFieldHtml("receive-cost", hasCost?p.cost:"", "Cost/u", `data-default="${esc(hasCost?p.cost:"")}"`, "width:80px;")}</td>
      <td>${actionsCell}</td>
    </tr>` : `
    <tr>
      <td>${esc(p.baseProduct)}</td>
      <td>${esc(categoryFor(p.baseProduct)||"—")}</td>
      <td class="helptext">${esc(p.date||"—")}${overdue ? ` ${chip("overdue","warn")}` : ""}</td>
      <td>${costCell}</td>
      <td>${esc(p.supplier||"—")}</td>
      <td>${esc(p.loggedBy||"—")}</td>
      <td>${actionsCell}</td>
    </tr>`;
  }).join("");

  const notReceivedRows = notReceivedShown.map(p=>`
    <tr>
      <td>${esc(p.baseProduct)}</td>
      <td class="helptext">${esc(p.date||"—")}</td>
      <td>${esc(p.supplier||"—")}</td>
      <td>${esc(p.notReceivedReason||"—")}</td>
      <td class="helptext">${esc(p.notReceivedBy||"—")} · ${esc(p.notReceivedDate||"—")}</td>
      <td>${manage ? `<button class="btn small" data-notreceived-reopen="${esc(p.id||"")}" title="Send back to Pending delivery">↺ Reopen</button>` : ""}</td>
    </tr>`).join("");

  const receivedRows = recentlyReceivedShown.map(p=>{
    const editing = receivingEditing.has(p.id);
    // No p.qty at all means this row never went through the order queue — it was logged directly here
    // as stock that showed up with nothing on file (see the "Log stock with no order on file" card
    // below), most often because procurement forgot to log the order in the first place.
    const noOrder = p.qty===undefined || p.qty===null || p.qty==="";
    const discFlag = discrepancyChipHtml(p);
    const noOrderFlag = noOrder ? chip("no order on file","neutral") : "";
    const editForm = manage && editing ? `
      <div class="buyrow" data-receive-row="${esc(p.id||"")}" style="display:flex;align-items:center;gap:4px;white-space:nowrap;margin-top:4px;">
        <input type="number" step="0.01" class="receive-qty" placeholder="Qty" value="${esc(p.receivedQty!==undefined?p.receivedQty:"")}" style="width:64px;">
        ${randFieldHtml("receive-cost", p.receivedCost!==undefined?p.receivedCost:"", "Cost/u", "", "width:80px;")}
        <button class="btn primary" data-receive-tick="${esc(p.id||"")}" title="Save correction" style="padding:2px 10px;font-size:12px;">✓ Save</button>
        <button class="btn" data-receive-edit-cancel="${esc(p.id||"")}" style="padding:2px 6px;font-size:12px;">✕</button>
      </div>` : "";
    // Deleting the row outright (vs. correcting its qty/cost via editForm above) is Owner-only — Shane's
    // call, since it removes the record entirely rather than fixing a miscount, and it's used elsewhere
    // (Purchase Costs, Sage CSV) as the received figures.
    const deleteBtn = isOwner() ? `<button class="btn small" data-del-received="${esc(p.id||"")}" title="Delete this received entry" style="color:var(--critical);">✕ Delete</button>` : "";
    const printBtn = `<button class="btn small" data-print-slip="${esc(p.id||"")}" title="Print a goods-received slip for this delivery">🖨 Print slip</button>`;
    return `
    <tr>
      <td>${esc(p.baseProduct)}</td>
      <td class="helptext">${esc(p.date||"—")} → received ${esc(p.receivedDate||"—")}${p.receivedTime ? " at " + esc(fmtTime(p.receivedTime)) : ""}</td>
      <td>${purchaseLineChip(p)} ${discFlag} ${noOrderFlag}</td>
      <td>${esc(p.receivedBy||"—")}</td>
      <td>${manage ? `<button class="btn small" data-receive-edit="${esc(p.id||"")}">${editing?"Cancel":"Correct"}</button>${editForm}` : ""} ${printBtn} ${deleteBtn}</td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Receiving</h2><p>${manage ? "Count what's actually arrived and enter it below — the ordered quantity is hidden on purpose so it doesn't get rubber-stamped. Your count and cost here become the real, final numbers used for costing (Sage CSV, Product Mixes)." : "What's still outstanding, and what's been confirmed recently. Read-only for your role."}</p></div>
      <div class="actions">
        <div class="field" style="min-width:220px;"><label>Search</label><input type="text" id="receivingSearchInput" placeholder="Base product or supplier…" value="${esc(receivingSearch)}"></div>
      </div>
    </div>
    <div class="cardrow">
      ${receivingStatBlock("Pending delivery", "pending", tileFilter, pending.length, pending.length?'var(--warn)':'var(--good)')}
      ${receivingStatBlock(rangeStatLabel, "received", tileFilter, recentlyReceived.length, undefined, true)}
      ${receivingStatBlock(rangeDiscStatLabel, "discrepancy", tileFilter, discrepancyCount, discrepancyCount?'var(--warn)':'var(--good)')}
      ${canMarkNotReceived ? receivingStatBlock("Not received", "notreceived", tileFilter, notReceived.length, notReceived.length?'var(--critical)':'var(--good)') : ""}
    </div>
    ${manage ? `
    <div class="card">
      <div class="cardhead"><div><h3>Log stock with no order on file</h3><div class="desc">Stock showed up but procurement never logged an order for it? Count it and record it here directly — it's tracked as received immediately, same as anything confirmed above.</div></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Base product</label><input type="text" id="directReceiveBase" list="baseProductsDL"></div>
          <div class="field"><label>Quantity received</label><input type="number" step="0.01" id="directReceiveQty" placeholder="e.g. 10"></div>
          <div class="field"><label>Cost per unit</label>${randFieldHtml("", "", "if known", 'id="directReceiveCost"')}</div>
          <div class="field"><label>Supplier</label><input type="text" id="directReceiveSupplier" placeholder="optional"></div>
          <div><button class="btn primary" id="logDirectReceipt">+ Log received stock</button></div>
        </div>
      </div>
    </div>
    ${datalistOptions("baseProductsDL", distinctBaseProducts())}
    ` : ""}
    ${showPendingCard ? `
    <div class="card">
      <div class="cardhead"><div><h3>Pending delivery</h3><div class="desc">${search ? `${pendingShown.length} of ${pending.length}` : pending.length} order(s) awaiting confirmation, oldest first.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Ordered</th><th>Cost</th><th>Supplier</th><th>Ordered by</th>${manage?"<th>Amount</th><th>Price</th><th></th>":"<th>Status</th>"}</tr></thead>
          <tbody>${pendingRows || (search ? `<tr><td colspan="${manage?9:7}" class="empty">No pending deliveries match "${esc(receivingSearch)}".</td></tr>` : `<tr><td colspan="${manage?9:7}" class="empty">Nothing outstanding — everything logged so far has been confirmed received.</td></tr>`)}</tbody>
        </table></div>
      </div>
    </div>` : ""}
    ${showNotReceivedCard ? `
    <div class="card">
      <div class="cardhead"><div><h3>Not received</h3><div class="desc">${search ? `${notReceivedShown.length} of ${notReceived.length}` : notReceived.length} order(s) confirmed as NOT arriving, with a reason on file. Reopen sends one back to Pending delivery.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Ordered</th><th>Supplier</th><th>Reason</th><th>Marked by</th><th></th></tr></thead>
          <tbody>${notReceivedRows || (search ? `<tr><td colspan="6" class="empty">No "not received" lines match "${esc(receivingSearch)}".</td></tr>` : `<tr><td colspan="6" class="empty">Nothing marked not received.</td></tr>`)}</tbody>
        </table></div>
      </div>
    </div>` : ""}
    ${showRecentlyReceivedCard ? `
    <div class="card">
      <div class="cardhead">
        <div><h3>Recently received</h3><div class="desc">${search ? `${recentlyReceivedShown.length} of ${(discrepancyOnly?discrepancyCount:recentlyReceived.length)} shown, c` : "C"}onfirmed in ${rangeLabel}.${discrepancyOnly ? " Showing only deliveries with a discrepancy — what arrived didn't match what was ordered." : " A discrepancy flag means what arrived didn't match what was ordered."}</div></div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div class="field" style="min-width:140px;"><label>From</label><input type="date" id="receivingDateFromInput" value="${esc(receivingDateFrom)}" max="${esc(todayStr)}"></div>
          <div class="field" style="min-width:140px;"><label>To</label><input type="date" id="receivingDateToInput" value="${esc(receivingDateTo)}" max="${esc(todayStr)}"></div>
          ${customRange ? `<button class="btn small" id="receivingDateReset" type="button" title="Back to the last ${RECEIVING_RECENT_DAYS} days">Reset</button>` : ""}
        </div>
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Dates</th><th>Received</th><th>Received by</th><th></th></tr></thead>
          <tbody>${receivedRows || (search ? `<tr><td colspan="5" class="empty">No recently received lines match "${esc(receivingSearch)}".</td></tr>` : `<tr><td colspan="5" class="empty">${discrepancyOnly ? `No discrepancies in ${rangeWindowWord}.` : `Nothing confirmed received in ${rangeWindowWord} yet.`}</td></tr>`)}</tbody>
        </table></div>
      </div>
    </div>` : ""}`;
}

// ---------- Home Dashboard (landing page, Owner + Procurement only) ----------
// Pulls together the "needs attention" signal that already exists scattered across Shopping List,
// Receiving, Calculated Holdings and Purchase Costs, so the first thing either role sees after logging
// in is what actually needs doing — not a page they then have to go hunting through five tabs to piece
// together themselves. Every number here is read STRAIGHT from the same computed functions those pages
// already use (shoppingListComputed, procurementPlanComputed, isReceived/receivingDiscrepancy,
// distinctBaseProducts) — never recomputed independently — so this can never quietly drift out of sync
// with what those pages themselves show.
function navStat(label, count, color, tabId){
  return `<div class="stat clickable" data-goto-tab="${esc(tabId)}" title="Go to ${esc(label)}">
    <div class="label">${esc(label)}</div><div class="value" style="color:${color}">${count}</div>
  </div>`;
}
function plainStat(label, count, color){
  return `<div class="stat"><div class="label">${esc(label)}</div><div class="value" style="color:${color}">${count}</div></div>`;
}
function renderHomeDashboard(){
  const today = new Date().toISOString().slice(0,10);
  // Calculated Holdings is Owner-only (see ROLE_TABS) — Procurement still gets told a number is flagged
  // there since it affects what they should be buying, just without a dead link they can't follow.
  const canSeeHoldings = roleCanAccessTab(currentUser.role, "dashboard");

  // ---- Shopping List: what's still outstanding today ----
  const hiddenCats = hiddenCategorySet();
  const shoppingRows = shoppingListComputed().filter(r=> !hiddenCats.has(r.category||"Uncategorized"));
  const criticalCount = shoppingRows.filter(r=> r.status==="Critical").length;
  // "Needs action today" = actually still open — Critical/Buy AND nothing logged for it yet today
  // (no purchase line, no "unable to purchase"). A Critical item already ordered this morning isn't
  // sitting neglected, so it drops out of this list even though it's still Critical stock-wise.
  const needsActionRows = shoppingRows.filter(r=>
    (r.status==="Critical" || r.status==="Buy") &&
    purchaseEntriesForDate(r.baseProduct, today).length===0 &&
    !unableEntryForDate(r.baseProduct, today)
  );

  // ---- Receiving: pending, overdue, discrepancies (same source data as renderReceiving) ----
  const pending = DATA.purchaseCosts.filter(p=> p.baseProduct && !isReceived(p) && !isNotReceived(p))
    .slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"") || a.baseProduct.localeCompare(b.baseProduct));
  const overduePending = pending.filter(p=> p.date && p.date < today);
  const recentCutoff = new Date(Date.now() - RECEIVING_RECENT_DAYS*86400000).toISOString().slice(0,10);
  const recentlyReceived = DATA.purchaseCosts.filter(p=> p.baseProduct && isReceived(p) && p.receivedDate >= recentCutoff);
  const discrepancyRows = recentlyReceived.filter(p=> receivingDiscrepancy(p));

  // ---- Calculated Holdings: consistency/missing-data flags ----
  const planRows = procurementPlanComputed();
  const flaggedRows = planRows.filter(r=> r.consistency!=="OK" || r.missing!=="OK");

  // ---- Purchase Costs: base products logged that Item Setup doesn't recognize ----
  const knownProducts = distinctBaseProducts();
  const unmatchedNames = Array.from(new Set(
    DATA.purchaseCosts.filter(p=> p.baseProduct && !knownProducts.includes(p.baseProduct)).map(p=>p.baseProduct)
  )).sort();

  // ---- Price History: products with a big purchase-to-purchase move recently ----
  const priceAlerts = recentPriceAlerts(RECEIVING_RECENT_DAYS);

  const goto = (tabId, label)=> `<button class="btn small" data-goto-tab="${esc(tabId)}">${esc(label)}</button>`;

  const needsActionHtml = needsActionRows.slice(0,15).map(r=>`
    <tr>
      <td>${esc(r.baseProduct)}</td>
      <td>${esc(r.category||"—")}</td>
      <td>${shoppingStatusChip(r.status)}<br>${stockPctBadge(r)}</td>
      <td class="num">${r.currentStock!==null ? fmtNum(r.currentStock) : "—"}</td>
      <td class="num">${r.toBuy!==null ? fmtNum(r.toBuy,0) : "—"}</td>
      <td>${esc(r.procUnit||"—")}</td>
    </tr>`).join("");

  const pendingHtml = pending.slice(0,10).map(p=>{
    const overdue = p.date && p.date < today;
    return `
    <tr>
      <td>${esc(p.baseProduct)}</td>
      <td class="helptext">${esc(p.date||"—")}${overdue?` ${chip("overdue","warn")}`:""}</td>
      <td>${esc(p.supplier||"—")}</td>
      <td>${esc(p.loggedBy||"—")}</td>
    </tr>`;
  }).join("");

  const discrepancyHtml = discrepancyRows.slice(0,10).map(p=>`
    <tr>
      <td>${esc(p.baseProduct)}</td>
      <td class="helptext">received ${esc(p.receivedDate||"—")}${p.receivedTime ? " at " + esc(fmtTime(p.receivedTime)) : ""}</td>
      <td>${discrepancyChipHtml(p)}</td>
    </tr>`).join("");

  const flaggedHtml = flaggedRows.slice(0,10).map(r=>`
    <tr>
      <td>${esc(r.baseProduct)}</td>
      <td>${esc(r.category||"—")}</td>
      <td>${statusChip(r.consistency)}</td>
      <td>${statusChip(r.missing)}</td>
    </tr>`).join("");

  const unmatchedHtml = unmatchedNames.slice(0,10).map(bp=>{
    const count = DATA.purchaseCosts.filter(p=>p.baseProduct===bp).length;
    return `<tr><td>${esc(bp)}</td><td class="num">${count} line${count===1?"":"s"} logged</td></tr>`;
  }).join("");

  const priceAlertHtml = priceAlerts.slice(0,10).map(a=>`
    <tr>
      <td>${esc(a.baseProduct)}</td>
      <td class="helptext">${esc(a.date)}</td>
      <td class="num">${money(a.prevCost)} → ${money(a.cost)}</td>
      <td>${chip((a.direction==="up"?"▲ +":"▼ ")+Math.round(a.changePct*100)+"%", a.direction==="up"?"critical":"good")}</td>
    </tr>`).join("");

  return `
    <div class="pagehead">
      <div><h2>Dashboard</h2><p>Everything that needs a look right now, pulled from Shopping List, Receiving, Calculated Holdings and Purchase Costs — open any section below for the full picture.</p></div>
    </div>
    <div class="cardrow">
      ${navStat("Critical stock", criticalCount, criticalCount?'var(--critical)':'var(--good)', "shoppinglist")}
      ${navStat("Needs action today", needsActionRows.length, needsActionRows.length?'var(--warn)':'var(--good)', "shoppinglist")}
      ${navStat("Pending deliveries", pending.length, pending.length?'var(--warn)':'var(--good)', "receiving")}
      ${navStat("Overdue orders", overduePending.length, overduePending.length?'var(--critical)':'var(--good)', "receiving")}
    </div>
    <div class="cardrow">
      ${navStat("Receiving discrepancies ("+RECEIVING_RECENT_DAYS+"d)", discrepancyRows.length, discrepancyRows.length?'var(--warn)':'var(--good)', "receiving")}
      ${navStat("Price alerts ("+RECEIVING_RECENT_DAYS+"d)", priceAlerts.length, priceAlerts.length?'var(--warn)':'var(--good)', "pricehistory")}
      ${canSeeHoldings
        ? navStat("Flagged in Calculated Holdings", flaggedRows.length, flaggedRows.length?'var(--warn)':'var(--good)', "dashboard")
        : plainStat("Flagged in Calculated Holdings (Owner only)", flaggedRows.length, flaggedRows.length?'var(--warn)':'var(--good)')}
      ${navStat("Unmatched products", unmatchedNames.length, unmatchedNames.length?'var(--warn)':'var(--good)', "purchase")}
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Needs buying today</h3><div class="desc">Critical or Consider Buying stock with nothing logged yet today — ${needsActionRows.length} of ${shoppingRows.length} tracked products.</div></div>
        ${goto("shoppinglist","Open Shopping List →")}
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Status</th><th class="num">Current stock</th><th class="num">Suggested buy</th><th>Unit</th></tr></thead>
          <tbody>${needsActionHtml || `<tr><td colspan="6" class="empty">Nothing outstanding — everything Critical or Consider Buying has been logged for today.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Receiving</h3><div class="desc">${pending.length} order(s) awaiting confirmation${overduePending.length?`, ${overduePending.length} overdue`:""}.</div></div>
        ${goto("receiving","Open Receiving →")}
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Ordered</th><th>Supplier</th><th>Ordered by</th></tr></thead>
          <tbody>${pendingHtml || `<tr><td colspan="4" class="empty">Nothing pending — everything logged so far has been confirmed received.</td></tr>`}</tbody>
        </table></div>
      </div>
      ${discrepancyRows.length ? `<div class="cardbody" style="padding-top:0;">
        <div class="desc" style="margin-bottom:8px;">${discrepancyRows.length} discrepanc${discrepancyRows.length===1?"y":"ies"} in the last ${RECEIVING_RECENT_DAYS} days — what arrived didn't match what was ordered:</div>
        <div class="tablewrap" style="border:1px solid var(--line); border-radius:8px;"><table>
          <thead><tr><th>Base product</th><th>Received</th><th>Flag</th></tr></thead>
          <tbody>${discrepancyHtml}</tbody>
        </table></div>
      </div>` : ""}
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Price alerts</h3><div class="desc">${priceAlerts.length} product${priceAlerts.length===1?"":"s"} moved ${Math.round((Number(DATA.shoppingList.priceAlertPct)||0.25)*100)}% or more in the last ${RECEIVING_RECENT_DAYS} days.</div></div>
        ${goto("pricehistory","Open Price History →")}
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Date</th><th>Was → Now</th><th>Move</th></tr></thead>
          <tbody>${priceAlertHtml || `<tr><td colspan="4" class="empty">No big price moves in the last ${RECEIVING_RECENT_DAYS} days.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Calculated Holdings flags</h3><div class="desc">${flaggedRows.length} of ${planRows.length} base products have inconsistent or missing data.</div></div>
        ${canSeeHoldings ? goto("dashboard","Open Calculated Holdings →") : ""}
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th>Category</th><th>Consistency</th><th>Missing</th></tr></thead>
          <tbody>${flaggedHtml || `<tr><td colspan="4" class="empty">Nothing flagged — every tracked product has clean, consistent data.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead">
        <div><h3>Unmatched products</h3><div class="desc">Logged in a purchase but not found in Item Setup — usually a misspelling or a product that still needs setting up.</div></div>
        ${goto("purchase","Open Purchase Costs →")}
      </div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;"><table>
          <thead><tr><th>Base product</th><th></th></tr></thead>
          <tbody>${unmatchedHtml || `<tr><td colspan="2" class="empty">Nothing unmatched — every logged purchase lines up with an Item Setup product.</td></tr>`}</tbody>
        </table></div>
      </div>
    </div>`;
}

// ---------- Dashboard / Procurement Plan ----------
function renderDashboard(){
  const allRows = procurementPlanComputed();
  const flagged = allRows.filter(r=>r.consistency!=="OK" || r.missing!=="OK").length;
  const tracked = allRows.length;
  const cm = DATA.procurementPlan.coverMultiplier;
  const sb = DATA.procurementPlan.safetyBuffer;
  const hw = demandHistoryWindow();
  const historyPeriods = DATA.salesHistory.length;
  const critPct = Number(DATA.shoppingList.criticalPct)||0.25;
  const overPct = Number(DATA.shoppingList.overstockPct)||1.5;
  const buyPct = Number(DATA.shoppingList.buyPct)||1;
  const pendingReceiving = DATA.purchaseCosts.filter(p=> p.baseProduct && !isReceived(p) && !isNotReceived(p)).length;
  const recentReceivingCutoff = new Date(Date.now() - RECEIVING_RECENT_DAYS*86400000).toISOString().slice(0,10);
  const receivingDiscrepancies = DATA.purchaseCosts.filter(p=> p.baseProduct && isReceived(p) && p.receivedDate >= recentReceivingCutoff && receivingDiscrepancy(p)).length;

  const categories = Array.from(new Set(allRows.map(r=> r.category || "Uncategorized"))).sort();
  const categoryFilterOptions = `<option value="">All categories</option>` +
    categories.map(c=>`<option value="${esc(c)}" ${c===dashboardCategoryFilter?"selected":""}>${esc(c)}</option>`).join("");

  const rows = dashboardCategoryFilter ? allRows.filter(r=> (r.category||"Uncategorized")===dashboardCategoryFilter) : allRows;

  const tableRows = rows.map(r=>`
    <tr>
      <td>${esc(r.baseProduct)}</td>
      <td>${esc(r.category||"—")}</td>
      <td>${esc(r.procUnit||"—")}</td>
      <td class="num">${r.historyPeriods ? (r.historyPeriods+" day"+(r.historyPeriods===1?"":"s")) : "—"}</td>
      <td class="num">${r.avgDemand!==null ? fmtNum(r.avgDemand) : "—"}</td>
      <td><input class="rowinput num" data-cycle-input="${esc(r.baseProduct)}" value="${DATA.productCycles[r.baseProduct]!==undefined && DATA.productCycles[r.baseProduct]!==null ? DATA.productCycles[r.baseProduct] : ""}" placeholder="${fmtNum(cm,2)}" style="max-width:80px;"></td>
      <td><input class="rowinput num" data-ceiling-input="${esc(r.baseProduct)}" value="${DATA.productCeilings[r.baseProduct]!==undefined && DATA.productCeilings[r.baseProduct]!==null ? DATA.productCeilings[r.baseProduct] : ""}" placeholder="none" style="max-width:80px;"></td>
      <td class="num" style="font-weight:600;">${r.recommended!==null ? fmtNum(r.recommended,0) : "—"}${r.cappedByCeiling ? ` <span class="helptext" title="Capped by shelf-life max hold">⚠</span>` : ""}</td>
      <td>${statusChip(r.consistency)}</td>
      <td>${statusChip(r.missing)}</td>
    </tr>`).join("");

  const historyRows = DATA.salesHistory.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(h=>`
    <div class="quickbuylogrow">
      <span>${esc(h.date)}</span>
      <span style="display:flex;align-items:center;gap:10px;">
        <span class="helptext">${Object.keys(h.demand||{}).length} product${Object.keys(h.demand||{}).length===1?"":"s"}</span>
        <button class="btn small" data-del-history="${esc(h.date)}">Remove</button>
      </span>
    </div>`).join("");

  return `
    <div class="pagehead">
      <div><h2>Calculated Holdings</h2><p>How much of each base product to hold, converted into the unit you actually buy in — based on a rolling average (and day-to-day spread) of demand across every sales upload archived so far, not just the one currently loaded. Upload daily (backdating historical reports if you have them) for the fastest, most accurate picture.</p></div>
      <div class="actions"><button class="btn primary" id="savePlanSettings">Save settings</button></div>
    </div>
    <div class="cardrow">
      <div class="stat"><div class="label">Base products tracked</div><div class="value">${tracked}</div></div>

// ---------- Recipes ----------
function renderRecipes(){
  const totals = recipeCompositeTotals();
  const derived = itemSetupDerived();
  const qtyMap = {}; derived.forEach(it=>qtyMap[it.item]=it.combinedQty);
  const itemTexts = allItemTexts();
  const mixCosts = compositeMixCosts();

  const rows = DATA.recipes.map((rec,i)=>{
    const compQty = qtyMap[rec.compositeItem] || 0;
    const factor = (rec.percent!==null && rec.percent!==undefined && rec.percent!=="") ? Number(rec.percent) : (Number(rec.fixedQty)||0);
    const req = round2(compQty*factor);
    const compOk = DATA.itemSetup.some(it=>it.item===rec.compositeItem);
    const ingOk = DATA.itemSetup.some(it=>it.item===rec.ingredientItem);
    const pctTotal = totals[rec.compositeItem];
    let pctCheck = "—";
    if(rec.percent!==null && rec.percent!==undefined && rec.percent!=="" && pctTotal!==undefined){
      pctCheck = Math.abs(pctTotal-1)<0.001 ? "OK - 100%" : ("Check - totals "+Math.round(pctTotal*100)+"%");
    }
    return `<tr>
      <td><input class="rowinput" data-recidx="${i}" data-field="compositeItem" value="${esc(rec.compositeItem)}" list="itemsDL">${compOk?"":chip("not found","critical")}</td>
      <td><input class="rowinput" data-recidx="${i}" data-field="ingredientItem" value="${esc(rec.ingredientItem)}" list="itemsDL">${ingOk?"":chip("not found","critical")}</td>
      <td><input class="rowinput num" data-recidx="${i}" data-field="percent" value="${rec.percent!==null&&rec.percent!==undefined&&rec.percent!==""?round2(rec.percent*100):""}" placeholder="%" style="max-width:80px;"></td>
      <td><input class="rowinput num" data-recidx="${i}" data-field="fixedQty" value="${rec.fixedQty!==null&&rec.fixedQty!==undefined&&rec.fixedQty!==""?rec.fixedQty:""}" placeholder="qty" style="max-width:90px;"></td>
      <td class="num">${fmtNum(req)}</td>
      <td>${pctCheck==="—"?"—":(pctCheck.startsWith("OK")?chip(pctCheck,"good"):chip(pctCheck,"warn"))}</td>
      <td><button class="delbtn" data-del-recipe="${i}" title="Remove row">✕</button></td>
    </tr>`;
  }).join("");

  const mixCostRows = mixCosts.map(m=>{
    const made = m.breakdown.map(b=>{
      const label = b.isPercent ? (Math.round(b.factor*100)+"%") : ("×"+fmtNum(b.factor,4));
      const costTxt = b.ingredientCost!==null ? money(b.ingredientCost) : "cost unknown";
      const contribTxt = b.contribution!==null ? (" = "+money(b.contribution)) : "";
      const style = b.contribution===null ? ` style="color:var(--critical);"` : "";
      return `<span${style}>${esc(b.ingredientItem)} (${label} × ${costTxt}${contribTxt})</span>`;
    }).join(", ");
    return `<tr>
      <td>${esc(m.compositeItem)}</td>
      <td class="num" style="font-weight:600;">${m.cost!==null ? money(m.cost) : "—"}</td>
      <td class="helptext">${made || "—"}${m.complete?"":` ${chip("Incomplete — missing an ingredient cost","critical")}`}</td>
    </tr>`;
  }).join("");

  return `
    <div class="pagehead">
      <div><h2>Product Mixes</h2><p>For products assembled in-house from other stock (e.g. Roast Veg Mix). Ingredient demand flows automatically into that ingredient's own Item Setup row.</p></div>
      <div class="actions"><button class="btn primary" id="saveRecipes">Save changes</button></div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>Product mix costs</h3><div class="desc">Cost per unit for each mix, built from the current known cost of its ingredients (their most recently logged Purchase Cost) — recalculates automatically the moment you log a new purchase for any ingredient, no manual update needed. Also feeds the Sage CSV export.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;">
          <table>
            <thead><tr><th>Composite item (mix)</th><th class="num">Cost / unit</th><th>Made from</th></tr></thead>
            <tbody>${mixCostRows || `<tr><td colspan="3" class="empty">No product mixes yet — add one below.</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    </div>
    ${datalistOptions("itemsDL", itemTexts)}
    <div class="card">
      <div class="cardhead"><div><h3>Add an ingredient line</h3><div class="desc">Fill in EITHER % of composite OR fixed qty per unit, not both.</div></div></div>
      <div class="cardbody">
        <div class="formgrid">
          <div class="field"><label>Composite item (the mix)</label><input type="text" id="newRecComposite" list="itemsDL"></div>
          <div class="field"><label>Ingredient item (the raw item)</label><input type="text" id="newRecIngredient" list="itemsDL"></div>
          <div class="field"><label>% of composite</label><input type="number" step="1" id="newRecPercent" placeholder="e.g. 20"></div>
          <div class="field"><label>OR fixed qty per unit</label><input type="number" step="0.0001" id="newRecFixed" placeholder="e.g. 0.05"></div>
          <div><button class="btn primary" id="addRecipeRow">Add line</button></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="cardhead"><div><h3>All product mix lines</h3><div class="desc">Edit any field directly — e.g. swap the ingredient item when a mix changes — then Save changes.</div></div></div>
      <div class="cardbody" style="padding:0;">
        <div class="tablewrap" style="border:none;border-radius:0;">

// Which recent days have had an Item Sales report submitted for them, so a missed day is easy to
// spot at a glance rather than discovered later as an unexplained gap in Calculated Holdings' averages.
const UPLOAD_COVERAGE_WINDOW = 30;
// Oldest-first list of ISO dates in the last UPLOAD_COVERAGE_WINDOW days (excluding today) with no
// submitted Item Sales report yet. Shared by the Upload history strip below and by renderSalesData's
// auto-default for the Report date field (Shane's ask: default to the oldest missing date).
function salesUploadMissingDates(){
  const uploaded = new Set(DATA.salesHistory.map(h=>h.date));
  const today = new Date().toISOString().slice(0,10);
  const missing = [];
  for(let i=UPLOAD_COVERAGE_WINDOW-1;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    if(iso<today && !uploaded.has(iso)) missing.push(iso);
  }
  return missing;
}
function renderUploadCoverage(){
  const uploaded = new Set(DATA.salesHistory.map(h=>h.date));
  const today = new Date().toISOString().slice(0,10);
  const DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const days = [];
  for(let i=UPLOAD_COVERAGE_WINDOW-1;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push({iso:d.toISOString().slice(0,10), dow:DOW[d.getDay()], num:d.getDate()});
  }
  const missing = salesUploadMissingDates();
  const cells = days.map(d=>{
    let status = "pending", label = "Today — not yet uploaded";
    if(uploaded.has(d.iso)){ status = "done"; label = "Uploaded"; }
    else if(d.iso<today){ status = "missing"; label = "Missing — no report submitted"; }
    return `<div class="covday ${status}" title="${esc(d.iso)}: ${label}"><span class="dow">${d.dow}</span><span class="num">${d.num}</span></div>`;
  }).join("");
  const shown = missing.slice(-6).map(esc).join(", ");
  const summary = missing.length
    ? `${chip(missing.length + " missing", "critical")} ${shown}${missing.length>6 ? " and " + (missing.length-6) + " more" : ""}`
    : chip("No gaps in the last " + UPLOAD_COVERAGE_WINDOW + " days", "good");
  return `
    <div class="card">
      <div class="cardhead"><div><h3>Upload history</h3><div class="desc">Last ${UPLOAD_COVERAGE_WINDOW} days — green means a report was submitted for that date, red means none was. Hover a day for the exact date.</div></div></div>
      <div class="cardbody">
        <div class="covgrid">${cells}</div>
        <div class="helptext" style="margin-top:10px;">${summary}</div>
      </div>
    </div>`;
}

  if(!salesUploadDateUserSet){
